<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Persistent AR Anchor</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-container { width: 100vw; height: 100vh; position: relative; }
        #status {
            position: absolute; 
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); 
            color: white;
            padding: 10px;
            font-family: Arial;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <div id="status">Scan target image to place anchor</div>
        <canvas id="ar-canvas"></canvas>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let worldAnchor = null;
            let model = null;
            let arScene = null;
            let renderer = null;

            // ======================
            // 1. INITIAL IMAGE TRACKING
            // ======================
            const mindarThree = new MindARThree({
                container: document.querySelector("#ar-container"),
                imageTargetSrc: "./targets.mind", // Your compiled target
                maxTrack: 1,
                uiScanning: "yes"
            });

            const { scene, camera, renderer: arRenderer } = mindarThree;
            renderer = arRenderer;
            arScene = scene;

            // ======================
            // 2. ANCHOR EXTRACTION
            // ======================
            mindarThree.onTargetFound = () => {
                document.getElementById("status").textContent = "Anchor captured!";
                
                // Get anchor position/orientation
                const anchorGroup = mindarThree.getAnchorGroup(0);
                worldAnchor = {
                    position: anchorGroup.position.clone(),
                    quaternion: anchorGroup.quaternion.clone(),
                    scale: anchorGroup.scale.clone()
                };

                // ======================
                // 3. VIRTUAL CONTENT PLACEMENT
                // ======================
                if (model) {
                    model.position.copy(worldAnchor.position);
                    model.quaternion.copy(worldAnchor.quaternion);
                    model.scale.copy(worldAnchor.scale);
                    model.visible = true;
                }

                // ======================
                // 4. STOP TRACKING
                // ======================
                setTimeout(() => {
                    mindarThree.stop();
                    document.getElementById("status").textContent = "Anchor locked - tracker disabled";
                }, 1000);
            };

            // Load 3D model (replace with your model)
            new THREE.GLTFLoader().load(
                "https://cdn.glitch.global/6d5d7e82-8e4a-407c-ae80-8854a6d5c911/dinosaur.glb",
                (gltf) => {
                    model = gltf.scene;
                    model.visible = false;
                    model.scale.set(0.5, 0.5, 0.5);
                    arScene.add(model);
                }
            );

            // Start AR
            await mindarThree.start();
            
            // Persistent render loop
            const animate = () => {
                requestAnimationFrame(animate);
                if (!mindarThree.isRunning) {
                    // Continue rendering after stopping tracker
                    renderer.render(arScene, camera);
                }
            };
            animate();
        });
    </script>
</body>
</html>
