<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Rooftop Sphere</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Bigger red sphere on rooftop (15m above you) -->
      <a-sphere
        color="red"
        radius="2.5"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 15 0"
      ></a-sphere>

      <!-- Label just above the sphere -->
      <a-text
        value="On the rooftop!"
        color="white"
        scale="15 15 15"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 18 0"
      ></a-text>

      <!-- Show your simulated GPS location for debug -->
      <a-entity
        id="debugText"
        position="0 0 -3"
        text="value: Waiting for GPS...; color: yellow; width: 6;"
      ></a-entity>

      <!-- Simulate your current GPS position (1st floor window) -->
      <a-camera
        gps-camera="simulateLatitude: 48.29001756836221; simulateLongitude: 14.282756650237488;"
        rotation-reader
      ></a-camera>

      <script>
        // Update the text to show your current (simulated) GPS coordinates
        window.addEventListener("gps-camera-update-position", (e) => {
          const lat = e.detail.position.latitude.toFixed(6);
          const lon = e.detail.position.longitude.toFixed(6);
          document
            .getElementById("debugText")
            .setAttribute("text", "value", `You are at:\n${lat}, ${lon}`);
        });
      </script>
    </a-scene>
  </body>
</html>
