<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Pin & Forget (Attribute Copy)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>body,html{margin:0;padding:0;overflow:hidden;width:100%;height:100}a-scene{width:100%;height:100}</style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + initial brown box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: brown;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (function() {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      trackerEl.addEventListener('targetFound', async () => {
        if (pinned) return;
        pinned = true;

        // 1) Turn brown → green
        liveBox.setAttribute('material','color: green;');

        // 2) Read A-Frame position attribute from liveBox
        const posAttr = liveBox.getAttribute('position');
        console.log('📐 liveBox attribute position:', posAttr);

        // 3) Create blue box at that same attribute position
        const blueBox = document.createElement('a-box');
        blueBox.setAttribute('depth','0.5');
        blueBox.setAttribute('height','0.5');
        blueBox.setAttribute('width','0.5');
        blueBox.setAttribute('material','color: blue;');
        // Use the exact same string values
        blueBox.setAttribute('position', `${posAttr.x} ${posAttr.y} ${posAttr.z}`);
        sceneEl.appendChild(blueBox);
        console.log('✅ Blue box appended with attribute copy, in scene?', sceneEl.contains(blueBox));

        // 4) Remove tracker & pause MindAR
        trackerEl.remove();
        await sceneEl.components['mindar-image'].pause();
        console.log('⏹️ Tracker removed & MindAR paused');
        console.log('🔒 Blue box still in scene after cleanup?', sceneEl.contains(blueBox));
      });
    })();
  </script>
</body>
</html>
