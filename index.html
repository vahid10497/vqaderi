<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Image-Tracking → Anchor & Forget</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <canvas id="xr-canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    let renderer, scene, camera;
    let xrRefSpace, xrAnchor = null;
    let box, anchorLocked = false;

    init();

    async function init() {
      // 1) Basic AR check
      if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar'))) {
        return alert('AR not supported');
      }

      // 2) Load marker.png
      const img = new Image();
      img.src = 'marker.png';
      await img.decode();
      const bitmap = await createImageBitmap(img);

      // 3) Three.js + ARButton
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('xr-canvas'), alpha: true });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(
        ARButton.createButton(renderer, {
          requiredFeatures: ['local-floor','image-tracking'],
          trackedImages:    [{ image: bitmap, widthInMeters: 0.2 }]
        })
      );

      // 4) Light + hidden box
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
      box = new THREE.Mesh(
        new THREE.BoxGeometry(0.2,0.2,0.2),
        new THREE.MeshStandardMaterial({ color: 0x00ff00 })
      );
      box.visible = false;
      scene.add(box);

      // 5) Reference space on start
      renderer.xr.addEventListener('sessionstart', async () => {
        xrRefSpace = await renderer.xr.getSession().requestReferenceSpace('local-floor');
      });

      // 6) Render loop
      renderer.setAnimationLoop(onXRFrame);
    }

    async function onXRFrame(time, frame) {
      const session = renderer.xr.getSession();
      // 7) If not yet anchored, do image-tracking
      if (!xrAnchor && !anchorLocked) {
        for (const result of frame.getImageTrackingResults()) {
          if (result.trackingState === 'tracked') {
            const pose = frame.getPose(result.imageSpace, xrRefSpace);
            if (pose) {
              xrAnchor = await frame.createAnchor(pose.transform, xrRefSpace);
              box.visible = true;
              // after 3s, lock and stop tracking
              setTimeout(() => anchorLocked = true, 3000);
            }
            break;
          }
        }
      }

      // 8) If we have an anchor, update box from it
      if (xrAnchor) {
        const p = frame.getPose(xrAnchor.anchorSpace, xrRefSpace);
        if (p) {
          box.matrix.fromArray(p.transform.matrix);
          box.matrix.decompose(box.position, box.quaternion, box.scale);
          box.matrixAutoUpdate = false;
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
