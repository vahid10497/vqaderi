<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NFT Marker "Marker"</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
    a-scene { width:100%; height:100%; }
    #debug {
      position: absolute; 
      top:0; 
      left:0;
      padding:0.5em;
      background:rgba(0,0,0,0.7);
      color:#0f0;
      font-family:monospace;
      z-index:1;
    }
  </style>
</head>
<body>
  <div id="debug">🔍 Loading AR environment...</div>

  <a-scene 
    embedded 
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-nft
      id="nftMarker"
      type="nft"
      url="./Marker"
      smooth="true"
      emitevents="true"
    >
      <a-box position="0 0.3 0" scale="0.5 0.5 0.5" material="color:red;"></a-box>
    </a-nft>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const debugDiv = document.getElementById('debug');
      
      // Simple event listeners
      const nftMarker = document.getElementById('nftMarker');
      nftMarker.addEventListener('markerFound', () => {
        debugDiv.innerText = '✅ Marker found';
      });
      
      nftMarker.addEventListener('markerLost', () => {
        debugDiv.innerText = '❌ Marker lost';
      });
      
      // Camera access handling
      const scene = document.querySelector('a-scene');
      scene.addEventListener('arjs-video-loaded', () => {
        debugDiv.innerText = '📸 Camera ready - Show your marker';
      });
      
      // Error handling
      scene.addEventListener('error', (e) => {
        debugDiv.innerHTML = '❌ Error: ' + (e.detail || 'Unknown error') + 
                            '<br>Check console for details';
        console.error('AR Error:', e.detail);
      });
    });
  </script>
</body>
</html>
