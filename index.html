<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Pin & Forget with Delay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + initial yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        rotation="0 0 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
  (function(){
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    const liveBox   = document.getElementById('liveBox');
    let pinned = false;

    trackerEl.addEventListener('targetFound', () => {
      if (pinned) return;
      pinned = true;

      // 1) Flip yellow → green
      liveBox.setAttribute('material','color: green;');

      // 2) Wait one frame for MindAR to update transforms
      requestAnimationFrame(() => {
        // 3) Capture world‐space pose
        const worldPos  = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        liveBox.object3D.getWorldPosition(worldPos);
        liveBox.object3D.getWorldQuaternion(worldQuat);

        // 4) Reparent to scene root
        sceneEl.appendChild(liveBox);

        // 5) Reapply exact pose as local attributes
        const worldEuler = new THREE.Euler().setFromQuaternion(worldQuat, 'XYZ');
        liveBox.setAttribute(
          'position',
          `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
        );
        liveBox.setAttribute(
          'rotation',
          `${THREE.MathUtils.radToDeg(worldEuler.x).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(worldEuler.y).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(worldEuler.z).toFixed(1)}`
        );

        console.log('✅ Box pinned in world-space; will detach tracker in 2s.');

        // 6) After 2s, remove the tracker entity
        setTimeout(() => {
          trackerEl.remove();
          console.log('🗑️ Tracker removed; green box remains and AR feed continues.');
        }, 2000);
      });
    });
  })();
  </script>
</body>
</html>
