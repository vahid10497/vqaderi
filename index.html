<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NFT Debug & Pin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js NFT build -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
    #debug { position:absolute; top:0; left:0; color:#0f0; background:rgba(0,0,0,0.7); padding:0.5em; font-family:monospace; z-index:1; }
  </style>
</head>
<body>
  <div id="debug">🔍 Waiting for NFT…</div>

  <a-scene  
    embedded  
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
  >
    <a-nft
      type="nft"
      url="marker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      emitevents="true"
      onMarkerFound="document.getElementById('debug').innerText='✅ NFT marker found'; console.log('markerFound');"
      onMarkerLost="document.getElementById('debug').innerText='❌ NFT marker lost'; console.log('markerLost');"
    >
      <a-box
        id="pinBox"
        position="0 0.3 0"
        scale="0.5 0.5 0.5"
        material="color: red;"
      ></a-box>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
