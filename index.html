<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Detach & Keep Green Box</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body,html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + initial yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        rotation="0 0 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
  (function(){
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    const liveBox   = document.getElementById('liveBox');
    let pinned = false;

    console.log('▶️ Waiting for tracker.targetFound…');

    trackerEl.addEventListener('targetFound', async () => {
      console.log('🎯 tracker.targetFound fired');
      if (pinned) {
        console.log('⚠️ Already pinned, skipping.');
        return;
      }
      pinned = true;

      // 1) Turn yellow → green
      console.log('1) liveBox: yellow → green');
      liveBox.setAttribute('material','color: green;');

      // 2) Wait a frame so AR transform is up-to-date
      requestAnimationFrame(async () => {
        // 3) Capture world-space position & quaternion
        const worldPos  = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        liveBox.object3D.getWorldPosition(worldPos);
        liveBox.object3D.getWorldQuaternion(worldQuat);
        console.log(`2) Captured worldPos: x=${worldPos.x.toFixed(3)}, y=${worldPos.y.toFixed(3)}, z=${worldPos.z.toFixed(3)}`);

        // 4) Reparent to scene root
        sceneEl.appendChild(liveBox);
        console.log('3) liveBox reparented under <a-scene>');

        // 5) Reapply the captured transform as local attributes
        const euler = new THREE.Euler().setFromQuaternion(worldQuat, 'XYZ');
        liveBox.setAttribute(
          'position',
          `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
        );
        liveBox.setAttribute(
          'rotation',
          `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.y).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`
        );
        console.log('4) Reapplied position & rotation attributes');

        // 6) Remove tracker & pause MindAR
        trackerEl.remove();
        await sceneEl.components['mindar-image'].pause();
        console.log('5) Tracker removed & MindAR paused');

        // 7) One-time verify box still present
        const posAttr = liveBox.getAttribute('position');
        const rotAttr = liveBox.getAttribute('rotation');
        console.log(`🔒 liveBox still present. position={x:${posAttr.x},y:${posAttr.y},z:${posAttr.z}} rotation={x:${rotAttr.x},y:${rotAttr.y},z:${rotAttr.z}}`);
      });
    });
  })();
  </script>
</body>
</html>
