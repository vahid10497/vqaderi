<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebXR Image-Tracking Sphere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; overflow:hidden; }
    #message {
      position:absolute; top:10px; width:100%; text-align:center;
      color:white; background:rgba(0,0,0,0.6); padding:0.5em;
      font-family:sans-serif; z-index:1;
    }
    #xr-canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <div id="message">🔍 Initializing AR…</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    let scene, camera, renderer;
    let xrRefSpace, xrAnchor = null;
    let sphere;

    init();

    async function init() {
      const msg = document.getElementById('message');

      // 1) Basic WebXR check
      if (!navigator.xr) {
        msg.textContent = '❌ WebXR not available';
        return;
      }
      if (!await navigator.xr.isSessionSupported('immersive-ar')) {
        msg.textContent = '❌ AR not supported';
        return;
      }

      // 2) Load marker.png for image-tracking
      msg.textContent = '📥 Loading marker.png…';
      let bitmap;
      try {
        const img = new Image();
        img.src = './marker.png';
        await img.decode();
        bitmap = await createImageBitmap(img);
      } catch (e) {
        console.error(e);
        msg.textContent = '❌ marker.png failed to load';
        return;
      }
      msg.textContent = '✅ marker.png loaded';

      // 3) Three.js scene setup (unchanged)
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('xr-canvas'),
        alpha: true,
        antialias: true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // 4) Prepare the sphere (hidden until we anchor it)
      sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphere.visible = false;
      scene.add(sphere);

      // 5) ARButton with image-tracking
      document.body.appendChild(
        ARButton.createButton(renderer, {
          requiredFeatures: ['local-floor', 'image-tracking'],
          trackedImages:    [{ image: bitmap, widthInMeters: 0.2 }]
        })
      );

      // 6) On session start—get local‐floor reference space
      renderer.xr.addEventListener('sessionstart', async () => {
        xrRefSpace = await renderer.xr.getSession()
                             .requestReferenceSpace('local-floor');
        msg.textContent = '▶️ Point your camera at the marker.png';
      });

      // 7) Start render loop
      renderer.setAnimationLoop(onXRFrame);
    }

    async function onXRFrame(time, frame) {
      const session = renderer.xr.getSession();
      const msg     = document.getElementById('message');

      // 8) If we haven’t yet created our anchor, look for the marker
      if (!xrAnchor) {
        const results = frame.getImageTrackingResults();
        for (const result of results) {
          if (result.trackingState === 'tracked') {
            // get pose in world space
            const pose = frame.getPose(result.imageSpace, xrRefSpace);
            if (pose) {
              // create a persistent anchor at that transform
              xrAnchor = await frame.createAnchor(pose.transform, xrRefSpace);
              msg.textContent = '✅ Marker detected — sphere anchored!';
              sphere.visible = true;
            }
            break;
          }
        }
      }

      // 9) If we have an anchor, update our sphere from it
      if (xrAnchor) {
        const anchorPose = frame.getPose(xrAnchor.anchorSpace, xrRefSpace);
        if (anchorPose) {
          sphere.matrix.fromArray(anchorPose.transform.matrix);
          sphere.matrix.decompose(
            sphere.position,
            sphere.quaternion,
            sphere.scale
          );
          sphere.matrixAutoUpdate = false;
        }
      }

      // 10) Render exactly as before
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
