<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GeoAR.js demo</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <a-entity
        id="model"
        gps-entity-place="latitude: 48.29001756836221; longitude: 14.282756650237488;"
        gltf-model="My_model.glb"
        scale="5 5 5"
        position="0 0 0"
        rotation="0 180 0"
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      // Wait 20 seconds to pin the model
      setTimeout(() => {
        const model = document.getElementById("model");

        // Get current world position
        const worldPos = new THREE.Vector3();
        model.object3D.getWorldPosition(worldPos);

        // Stop GPS tracking
        model.removeAttribute('gps-entity-place');

        // Move model to world-local fixed position
        const scene = document.querySelector("a-scene");
        const localPos = scene.object3D.worldToLocal(worldPos.clone());

        model.setAttribute("position", `${localPos.x} ${localPos.y} ${localPos.z}`);

        console.log("🔒 Model pinned at:", localPos);
      }, 20000); // 20 seconds
    </script>
  </body>
</html>
