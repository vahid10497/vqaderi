<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Geo+SLAM: First Floor @ 3 m</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }
    #status {
      position:absolute; top:0; left:0; right:0;
      background:rgba(0,0,0,0.6); color:#fff;
      padding:0.5em; text-align:center; z-index:10;
      pointer-events:none;
    }
    #debug-log {
      position:fixed; bottom:0; left:0; right:0;
      max-height:40%; overflow-y:auto;
      background:rgba(0,0,0,0.8); color:#fff;
      font-family:monospace; font-size:12px;
      padding:4px; z-index:9999;
      pointer-events: none;    /* ← let taps through */
    }
    canvas { width:100%; height:100%; display:block; }
  </style>
  <!-- If you have an Origin Trial token for anchors, insert it here: -->
  <!-- <meta http-equiv="origin-trial" content="YOUR_TOKEN_HERE"> -->
</head>
<body>

  <!-- On-screen status -->
  <div id="status">🔍 Starting up…</div>
  <!-- On-screen console log (non-interactive) -->
  <div id="debug-log"></div>
  <!-- AR canvas -->
  <canvas id="xr-canvas"></canvas>

  <!-- Wrap console.* to print to #debug-log -->
  <script>
    (function(){
      const logEl = document.getElementById('debug-log');
      ['log','warn','error'].forEach(level => {
        const orig = console[level].bind(console);
        console[level] = (...args) => {
          orig(...args);
          const msg = args.map(a => {
            try { return typeof a==='string'? a : JSON.stringify(a); }
            catch { return String(a); }
          }).join(' ');
          const line = document.createElement('div');
          line.textContent = `[${level}] ${msg}`;
          if (level==='error') line.style.color = 'salmon';
          if (level==='warn')  line.style.color = 'khaki';
          logEl.appendChild(line);
          logEl.scrollTop = logEl.scrollHeight;
        };
      });
    })();
  </script>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    // — YOUR TARGET COORDINATES —  
    const TARGET_LAT = 48.28961166630169;
    const TARGET_LON = 14.282566825905297;
    // Fixed model height in meters above your room’s floor:
    const FLOOR_MODEL_HEIGHT = 3;  

    const statusEl = document.getElementById('status');
    const setStatus = txt => {
      statusEl.textContent = txt;
      console.log(txt);
    };

    let scene, camera, renderer;
    let xrRefSpace, xrAnchor = null;
    let sphere;
    let userLat, userLon;

    // 1) Get GPS (lat/lon only)
    async function initGeo() {
      setStatus('📍 Acquiring GPS…');
      return new Promise((res, rej) => {
        if (!navigator.geolocation) return rej('GPS unsupported');
        navigator.geolocation.getCurrentPosition(p => {
          userLat = p.coords.latitude;
          userLon = p.coords.longitude;
          setStatus(`📍 GPS: ${userLat.toFixed(6)},${userLon.toFixed(6)}`);
          res();
        }, () => rej('❌ GPS error'));
      });
    }

    // 2) Get absolute compass heading
    function initCompass() {
      setStatus('🧭 Waiting for compass…');
      return new Promise(res => {
        window.addEventListener('deviceorientationabsolute', ev => {
          if (ev.alpha != null) {
            const heading = ev.alpha;
            setStatus(`🧭 Heading: ${heading.toFixed(1)}°`);
            // store globally:
            window.__heading = heading;
            res();
          }
        }, { once: true });
      });
    }

    // 3) ENU conversion helper
    function latLonToENU(lat, lon, lat0, lon0) {
      const R = 6378137;
      const dLat = THREE.MathUtils.degToRad(lat - lat0);
      const dLon = THREE.MathUtils.degToRad(lon - lon0);
      return {
        east:  dLon * R * Math.cos(THREE.MathUtils.degToRad(lat0)),
        north: dLat * R
      };
    }

    // 4) Three.js + ARButton
    function initThree() {
      setStatus('🎨 Initializing Three.js…');
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('xr-canvas'),
        alpha:true, antialias:true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Create the button and bump its z-index so it sits above our debug-log
      const btn = ARButton.createButton(renderer, {
        requiredFeatures: ['local-floor','anchors']
      });
      btn.style.zIndex = 10000;
      document.body.appendChild(btn);

      scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));
    }

    // 5) Create your 3D object (orange sphere)
    function initModel() {
      setStatus('🔶 Creating sphere…');
      sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.3,32,16),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphere.visible = false;
      scene.add(sphere);
    }

    // 6) On AR start: compute ENU offset + anchor
    function onSessionStart() {
      setStatus('▶️ AR session started—anchoring…');
      renderer.xr.getSession()
        .requestReferenceSpace('local-floor')
        .then(refSpace => {
          xrRefSpace = refSpace;

          // 6a) ENU offset user → target
          const { east, north } = latLonToENU(
            TARGET_LAT, TARGET_LON,
            userLat, userLon
          );
          setStatus(`➡️ Offset: east ${east.toFixed(1)} m, north ${north.toFixed(1)} m`);

          // 6b) fixed Y = FLOOR_MODEL_HEIGHT
          const up = FLOOR_MODEL_HEIGHT;
          setStatus(`↟ Model height: ${up.toFixed(1)} m`);

          // 6c) compass rotation
          const hRad = THREE.MathUtils.degToRad(window.__heading || 0);
          const rot = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(0, -hRad, 0, 'YXZ')
          );

          // 6d) create the XRRigidTransform and anchor
          const xf = new XRRigidTransform(
            { x: east, y: up, z: -north },
            { x: rot.x, y: rot.y, z: rot.z, w: rot.w }
          );
          renderer.xr.getFrame().createAnchor(xf, xrRefSpace)
            .then(a => {
              xrAnchor = a;
              setStatus('✅ Anchor created—showing sphere');
              sphere.visible = true;
              setTimeout(()=>{
                setStatus('🔒 Anchor locked at 3 m');
              }, 3000);
            })
            .catch(err => setStatus('❌ Anchor error: ' + err));
      });
    }

    // 7) Render loop: update sphere from anchor pose
    function renderLoop(time, frame) {
      if (frame && xrAnchor) {
        const ap = frame.getPose(xrAnchor.anchorSpace, xrRefSpace);
        if (ap) {
          sphere.matrix.fromArray(ap.transform.matrix);
          sphere.matrix.decompose(sphere.position, sphere.quaternion, sphere.scale);
          sphere.matrixAutoUpdate = false;
        } else {
          console.warn('No anchor pose this frame');
        }
      }
      renderer.render(scene, camera);
    }

    // 8) Bootstrap sequence
    (async function(){
      try {
        await initGeo();
        await initCompass();
      } catch (e) {
        return setStatus(`❌ Init error: ${e}`);
      }
      initThree();
      initModel();

      renderer.xr.addEventListener('sessionstart', onSessionStart);
      renderer.setAnimationLoop(renderLoop);

      setStatus('Tap ENTER AR to place at 3 m');
    })();

    // 9) Handle resizing
    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  </script>
</body>
</html>
