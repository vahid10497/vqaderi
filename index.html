<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Persistent AR Anchor</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-container { width: 100vw; height: 100vh; }
        #status {
            position: absolute; 
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); 
            color: white; padding: 10px;
            font-family: Arial; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <div id="status">Initializing AR...</div>
    </div>

    <script>
    async function startAR() {
        const statusEl = document.getElementById('status');
        
        try {
            // 1. Verify camera access
            statusEl.textContent = "Requesting camera...";
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { exact: "environment" }, // Force rear camera
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            stream.getTracks().forEach(t => t.stop());

            // 2. Initialize MindAR
            statusEl.textContent = "Loading AR engine...";
            const mindarThree = new MindARThree({
                container: document.getElementById("ar-container"),
                imageTargetSrc: "./targets.mind?cache=" + Date.now(),
                uiScanning: "yes",
                uiLoading: "yes"
            });

            // 3. Start AR
            await mindarThree.start();
            statusEl.textContent = "Scan target image!";

            // 4. Anchor logic
            mindarThree.onTargetFound = () => {
                statusEl.textContent = "Anchor locked!";
                setTimeout(() => mindarThree.stop(), 1000);
            };

        } catch (err) {
            statusEl.innerHTML = `
                <strong style="color:red">Error:</strong> ${err.name}<br>
                ${err.message}<br><br>
                ${err.name === 'NotAllowedError' ? 
                    'Allow camera access in browser settings' : 
                    'Reload page and try again'}
            `;
        }
    }
    startAR();
    </script>
</body>
</html>
