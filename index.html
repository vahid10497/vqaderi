<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Geo AR — Robust Pin & Anchor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif }
    #status {
      position:absolute; top:0; left:0; right:0;
      background:rgba(0,0,0,0.6); color:#fff;
      padding:0.5em; text-align:center; z-index:10;
      pointer-events:none;
    }
    #log {
      position:fixed; bottom:0; left:0; right:0;
      max-height:40%; overflow-y:auto;
      background:rgba(0,0,0,0.8); color:#fff;
      font:12px monospace; padding:4px; z-index:9999;
      pointer-events:none;
    }
    canvas { width:100%; height:100%; display:block }
  </style>
</head>
<body>
  <div id="status">🔍 Starting…</div>
  <div id="log"></div>
  <canvas id="xr-canvas"></canvas>

  <!-- on-screen console -->
  <script>
    (()=>{
      const out = document.getElementById('log');
      ['log','warn','error'].forEach(level=>{
        const orig = console[level].bind(console);
        console[level] = (...args)=>{
          orig(...args);
          const d = document.createElement('div');
          d.textContent = `[${level}] ${args.map(a=>typeof a==='string'?a:JSON.stringify(a)).join(' ')}`;
          if(level==='warn') d.style.color='khaki';
          if(level==='error') d.style.color='salmon';
          out.appendChild(d);
          out.scrollTop = out.scrollHeight;
        };
      });
    })();
  </script>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    // — YOUR GEO TARGET —
    const TARGET_LAT   = 48.2899839;
    const TARGET_LON   = 14.2829015;
    const MODEL_HEIGHT = 3.0;  // m above floor
    const EYE_HEIGHT   = 1.6;  // m

    const statusEl = document.getElementById('status');
    const setStatus = txt => { statusEl.textContent = txt; console.log(txt); };

    let scene, camera, renderer;
    let geoSphere, fallbackSphere;
    let userLat, userLon, heading;
    let gotGPS=false, gotCompass=false;
    let xrRefSpace=null, xrAnchor=null;
    let anchored=false, placeAttempts=0;

    // 1) GPS
    async function getGPS(){
      setStatus('📍 Getting GPS…');
      return new Promise((res, rej)=>{
        if(!navigator.geolocation) return rej('No GPS');
        navigator.geolocation.getCurrentPosition(
          p=>{
            userLat=p.coords.latitude;
            userLon=p.coords.longitude;
            gotGPS=true;
            setStatus(`📍 GPS: ${userLat.toFixed(6)},${userLon.toFixed(6)}`);
            res();
          },
          ()=>rej('GPS error'),
          { enableHighAccuracy:true, timeout:5000 }
        );
      });
    }

    // 2) Compass
    async function getCompass(){
      setStatus('🧭 Getting compass…');
      return new Promise(res=>{
        window.addEventListener('deviceorientationabsolute', ev=>{
          if(ev.alpha!=null){
            heading=ev.alpha;
            gotCompass=true;
            setStatus(`🧭 Heading: ${heading.toFixed(1)}°`);
            res();
          }
        }, { once:true, passive:true });
      });
    }

    // lat/lon → ENU
    function latLonToENU(lat,lon,lat0,lon0){
      const R=6378137;
      const dLat=THREE.MathUtils.degToRad(lat-lat0);
      const dLon=THREE.MathUtils.degToRad(lon-lon0);
      return {
        east:  dLon*R*Math.cos(THREE.MathUtils.degToRad(lat0)),
        north: dLat*R
      };
    }

    // 3) Three + ARButton
    function initThree(){
      setStatus('🎨 Init Three.js…');
      scene=new THREE.Scene();
      camera=new THREE.PerspectiveCamera();
      renderer=new THREE.WebGLRenderer({
        canvas:document.getElementById('xr-canvas'),
        alpha:true,antialias:true
      });
      renderer.xr.enabled=true;
      renderer.setSize(window.innerWidth,window.innerHeight);

      const btn=ARButton.createButton(renderer,{
        requiredFeatures:['local-floor','anchors']
      });
      btn.style.zIndex=10000;
      document.body.appendChild(btn);

      scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));
    }

    // 4) Models
    function initModels(){
      geoSphere=new THREE.Mesh(
        new THREE.SphereGeometry(0.5,32,16),
        new THREE.MeshStandardMaterial({ color:0xff6600 })
      );
      geoSphere.visible=false;
      scene.add(geoSphere);

      fallbackSphere=geoSphere.clone();
      fallbackSphere.material=new THREE.MeshStandardMaterial({ color:0x00ff00 });
      fallbackSphere.visible=false;
      scene.add(fallbackSphere);
    }

    // 5) Render/placement
    async function onXRFrame(t, frame){
      const session=frame.session;

      // 5a) get refSpace once
      if(!xrRefSpace){
        try{
          xrRefSpace=await session.requestReferenceSpace('local-floor');
          console.log('got local-floor refSpace');
        }catch(e){
          console.warn('refSpace fail',e);
        }
      }

      // 5b) placement logic, up to 5 attempts
      if(!anchored && placeAttempts++ < 5){
        if(xrRefSpace && gotGPS && gotCompass){
          // compute ENU
          const {east,north}=latLonToENU(
            TARGET_LAT,TARGET_LON,
            userLat,userLon
          );
          console.log('ENU',east,north);

          // orientation
          const h=Number.isFinite(heading)?heading:0;
          const rot=new THREE.Quaternion().setFromEuler(
            new THREE.Euler(0,-THREE.MathUtils.degToRad(h),0,'YXZ')
          );
          const pos={ x:east, y:MODEL_HEIGHT-EYE_HEIGHT, z:-north };
          console.log('Placing at',pos);

          // try anchor
          try{
            xrAnchor=await frame.createAnchor(
              new XRRigidTransform(pos,rot),
              xrRefSpace
            );
            setStatus('✅ Anchor created');
            geoSphere.visible=true;
            anchored=true;
          }catch(e){
            console.warn('anchor fail',e);
            setStatus('⚠️ Anchor fail, fallback');
            // fallback 2m in front
            const cam=renderer.xr.getCamera(camera);
            const dir=new THREE.Vector3(0,0,-1)
              .applyQuaternion(cam.quaternion);
            fallbackSphere.position.copy(
              cam.position.clone().add(dir.multiplyScalar(2))
            );
            fallbackSphere.quaternion.copy(cam.quaternion);
            fallbackSphere.visible=true;
            anchored=true;
          }
        } else {
          console.log('waiting sensors/refSpace',xrRefSpace,gotGPS,gotCompass);
        }
      }

      // 5c) if anchored via XR, update pose
      if(xrAnchor){
        const pose=frame.getPose(xrAnchor.anchorSpace, xrRefSpace);
        if(pose){
          geoSphere.matrix.fromArray(pose.transform.matrix);
          geoSphere.matrix.decompose(
            geoSphere.position,
            geoSphere.quaternion,
            geoSphere.scale
          );
          geoSphere.matrixAutoUpdate=false;
        }
      }

      renderer.render(scene,camera);
    }

    // 6) Bootstrap
    (async()=>{
      try{
        await getGPS();
        await getCompass();
      }catch(e){
        console.warn('sensor init error',e);
      }
      // wait a sec for stability
      await new Promise(r=>setTimeout(r,1000));

      initThree();
      initModels();
      renderer.xr.setAnimationLoop(onXRFrame);
      setStatus('Tap ENTER AR');
    })();

    window.addEventListener('resize',()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  </script>
</body>
</html>
