<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebXR Geospatial Anchor – 1st Floor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>body{margin:0;overflow:hidden;}canvas{width:100%;height:100%;}</style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    let scene, camera, renderer, sphere, anchor;
    // Your first‐floor GPS:
    const lat = 48.29002038491218,
          lon = 14.282757518735202,
          floorOffsetM = 3;  // ~3m up from ground

    init();
    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({alpha:true});
      renderer.setSize(innerWidth, innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ['geospatial']
      }));

      // simple sphere
      sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0x00ccff })
      );
      scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));
      scene.add(sphere);

      renderer.xr.addEventListener('sessionstart', async () => {
        const session = renderer.xr.getSession();
        const geoSpace = await session.requestReferenceSpace('geospatial');
        // Place anchor at ground altitude + floorOffsetM
        anchor = await geoSpace.createAnchor({
          latitude: lat,
          longitude: lon,
          // If your device reports altitude, you could add that:
          // altitude: userAlt + floorOffsetM
          altitude: floorOffsetM
        });
      });

      renderer.setAnimationLoop((t, frame) => {
        if (anchor && frame) {
          const pose = frame.getPose(
            anchor.anchorSpace,
            renderer.xr.getReferenceSpace()
          );
          if (pose) {
            sphere.position.set(
              pose.transform.position.x,
              pose.transform.position.y,
              pose.transform.position.z
            );
            sphere.quaternion.set(
              pose.transform.orientation.x,
              pose.transform.orientation.y,
              pose.transform.orientation.z,
              pose.transform.orientation.w
            );
          }
        }
        renderer.render(scene, camera);
      });
    }
  </script>
</body>
</html>
