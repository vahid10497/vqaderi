<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget (Manual)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100% }
    a-scene { width:100%; height:100% }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker with the red box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: red;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    let pinned = false;

    trackerEl.addEventListener('targetFound', async () => {
      if (pinned) return;
      pinned = true;

      // 1) Read world position & orientation from the tracker
      const worldPos = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();
      trackerEl.object3D.getWorldPosition(worldPos);
      trackerEl.object3D.getWorldQuaternion(worldQuat);

      console.log('World pos:', worldPos, 'quat:', worldQuat);

      // 2) Create a new box in the scene root at that world pose
      const anchorBox = document.createElement('a-box');
      anchorBox.setAttribute('position', `${worldPos.x} ${worldPos.y} ${worldPos.z}`);
      anchorBox.setAttribute('rotation', `${new THREE.Euler().setFromQuaternion(worldQuat).x * THREE.Math.RAD2DEG} ${new THREE.Euler().setFromQuaternion(worldQuat).y * THREE.Math.RAD2DEG} ${new THREE.Euler().setFromQuaternion(worldQuat).z * THREE.Math.RAD2DEG}`);
      anchorBox.setAttribute('depth', '0.5');
      anchorBox.setAttribute('height', '0.5');
      anchorBox.setAttribute('width', '0.5');
      anchorBox.setAttribute('material', 'color: orange;');

      sceneEl.appendChild(anchorBox);

      // 3) Hide the original tracker so it no longer shows/hides
      trackerEl.setAttribute('visible', 'false');

      // 4) Stop MindAR tracking entirely
      await sceneEl.components['mindar-image'].stop();

      console.log('✅ Pinned new box and stopped tracking.');
    });
  </script>
</body>
</html>
