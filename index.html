<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MindAR Minimal Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 1) A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- 2) MindAR core & A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
      a-scene { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="
        imageTargetSrc: ./YOUR_TARGETS_FILE.mind;
        autoStart: true;
      "
      device-orientation-permission-ui="enabled: true"
      debugUIEnabled="true"
      vr-mode-ui="enabled: false"
    >
      <!-- camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- on-target content: a red box -->
      <a-box mindar-image-target="targetIndex: 0"
             position="0 0 0.5"
             material="color: red;">
      </a-box>
    </a-scene>
  </body>
</html>
