<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR + Three.js Anchor Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>body { margin:0; overflow:hidden; }</style>
</head>
<body>
  <button id="start">Start AR</button>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';
    import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

    const startButton = document.getElementById('start');

    startButton.addEventListener('click', async () => {
      startButton.style.display = 'none';

      // 1) Initialize MindARThree
      const mindarThree = new MindARThree({
        container: document.body,
        imageTargetSrc: './targets.mind',
        maxTrack: 1,
      });
      const { renderer, scene, camera } = mindarThree;

      // 2) Add lighting
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // 3) Create ARButton + enable AR session
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));
      renderer.xr.enabled = true;

      // 4) Create an anchor for targetIndex 0
      const anchor = mindarThree.addAnchor(0);

      // 5) Create a placeholder box under the anchor
      const geo = new THREE.BoxGeometry(0.3,0.3,0.3);
      const mat = new THREE.MeshStandardMaterial({ color: 'brown' });
      const liveBox = new THREE.Mesh(geo, mat);
      liveBox.position.set(0, 0.5, 0);
      anchor.group.add(liveBox);

      // 6) On first detection, spawn a red sphere at the anchor’s world pose
      let pinned = false;
      anchor.onTargetFound = () => {
        if (pinned) return;
        pinned = true;

        // clone the world matrix of the anchor.group
        const m = anchor.group.matrixWorld.clone();
        const pos = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        const scl = new THREE.Vector3();
        m.decompose(pos, quat, scl);

        // make a red sphere and place it at pos/quaternion
        const sph = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 32,32),
          new THREE.MeshStandardMaterial({ color: 'red' })
        );
        sph.position.copy(pos);
        sph.quaternion.copy(quat);
        scene.add(sph);

        // detach it — it now lives free in world-space
        // you can also anchor it to a WebXR Anchor here if you like

        // leave the liveBox in place for 3s, then remove it
        setTimeout(() => anchor.group.remove(liveBox), 3000);
      };

      // 7) Start MindAR render loop
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
