<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR core & A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>body { margin: 0; overflow: hidden; }</style>
  </head>

  <body>
    <a-scene
      embedded
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
      "
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      debugUIEnabled="true"
      renderer="colorManagement: true"
    >
      <!-- mindar camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- your on-target content -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          color="blue"
          opacity="0.5"
          position="0 0 0"
          height="0.552"
          width="1"
          rotation="0 0 0"
        ></a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
