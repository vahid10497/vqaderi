<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js NFT Marker Example</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js with NFT support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="trackingMethod: nft; sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- NFT marker entity -->
      <a-nft
        type="nft"
        url="./marker" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5"
      >
        <!-- Your 3D model or primitive that appears when marker is detected -->
        <a-box color="blue" depth="0.5" height="0.5" width="0.5" position="0 0.25 0"></a-box>
      </a-nft>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
