<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GeoAR Pinning Demo</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <!-- GPS model (visible at first) -->
      <a-entity
        id="gps-model"
        gps-entity-place="latitude: 48.29001756836221; longitude: 14.282756650237488;"
        gltf-model="My_model.glb"
        scale="5 5 5"
        rotation="0 180 0"
      ></a-entity>

      <!-- Fixed model (invisible at first) -->
      <a-entity
        id="fixed-model"
        gltf-model="My_model.glb"
        scale="5 5 5"
        rotation="0 180 0"
        visible="false"
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      // After 20 seconds, switch from GPS to fixed model
      setTimeout(() => {
        const gpsModel = document.getElementById("gps-model");
        const fixedModel = document.getElementById("fixed-model");

        // Get current GPS model position in world space
        const position = gpsModel.object3D.position.clone();

        // Set fixed model to that position
        fixedModel.setAttribute("position", {
          x: position.x,
          y: position.y,
          z: position.z
        });

        // Hide GPS model and show fixed one
        gpsModel.setAttribute("visible", false);
        fixedModel.setAttribute("visible", true);
      }, 20000); // 20 seconds
    </script>
  </body>
</html>
