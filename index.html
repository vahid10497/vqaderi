<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Snap External Box (Fixed)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body,html { margin:0;padding:0;overflow:hidden;width:100%;height:100 }
    a-scene     { width:100%;height:100 }
    #debug {
      position:absolute; top:0; left:0;
      padding:.5em; color:#0f0; background:rgba(0,0,0,0.7);
      font-family:monospace; z-index:1;
    }
  </style>
</head>
<body>
  <div id="debug">🔍 Waiting for image…</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; debugUIEnabled: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + live yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box id="liveBox" position="0 0.5 0" scale="0.3 0.3 0.3" material="color: yellow;"></a-box>
    </a-entity>

    <!-- External box, initially hidden -->
    <a-box
      id="externalBox"
      visible="false"
      scale="0.5 0.5 0.5"
      material="color: red;"
    ></a-box>
  </a-scene>

  <script>
  (function(){
    const sceneEl     = document.getElementById('scene');
    const trackerEl   = document.getElementById('tracker');
    const liveBox     = document.getElementById('liveBox');
    const externalBox = document.getElementById('externalBox');
    const debug       = document.getElementById('debug');
    let pinned = false;

    trackerEl.addEventListener('targetFound', () => {
      if (pinned) return;
      pinned = true;
      debug.innerText = '✅ Image found! Snapping external box…';

      // 1) Ensure matrices are updated
      sceneEl.object3D.updateMatrixWorld(true);
      liveBox.object3D.updateWorldMatrix(true, false);

      // 2) Grab liveBox's matrixWorld and decompose it
      const mWorld = liveBox.object3D.matrixWorld.clone();
      const pos  = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scl  = new THREE.Vector3();
      mWorld.decompose(pos, quat, scl);

      // 3) Convert quat → Euler angles
      const euler = new THREE.Euler().setFromQuaternion(quat, 'XYZ');
      const rx = THREE.MathUtils.radToDeg(euler.x).toFixed(1);
      const ry = THREE.MathUtils.radToDeg(euler.y).toFixed(1);
      const rz = THREE.MathUtils.radToDeg(euler.z).toFixed(1);

      // 4) Apply to externalBox (object3D + A-Frame attrs)
      externalBox.object3D.position.copy(pos);
      externalBox.object3D.quaternion.copy(quat);
      externalBox.setAttribute('position', `${pos.x.toFixed(3)} ${pos.y.toFixed(3)} ${pos.z.toFixed(3)}`);
      externalBox.setAttribute('rotation', `${rx} ${ry} ${rz}`);
      externalBox.setAttribute('visible','true');

      debug.innerText = '🔒 External box snapped in place! Removing tracker in 3s…';

      // 5) After 3 seconds, remove the tracker & pause MindAR
      setTimeout(async () => {
        trackerEl.remove();
        await sceneEl.components['mindar-image'].pause();
        debug.innerText = '📌 Done. External box remains.';
      }, 3000);
    });
  })();
  </script>
</body>
</html>
