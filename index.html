<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebXR Image-Tracking Sphere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; overflow:hidden; }
    #xr-canvas { width:100%; height:100%; display:block; }
    #message {
      position:absolute; top:10px; width:100%; text-align:center;
      color:#fff; font-family:sans-serif; z-index:1;
      background:rgba(0,0,0,0.6); padding:0.5em;
    }
  </style>
</head>
<body>
  <div id="message">Initializing AR…</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let xrRefSpace, sphere, pinned = false;

    init();

    async function init() {
      // 1) Check WebXR AR support
      if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar'))) {
        document.getElementById('message').textContent =
          'AR not supported on this device/browser.';
        return;
      }

      // 2) Load the marker image
      const markerImg = new Image();
      markerImg.src = './marker.png'; // your marker in root
      await markerImg.decode();

      // 3) Three.js setup
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('xr-canvas'),
        alpha: true, antialias: true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);

      // 4) ARButton with image-tracking
      document.body.appendChild( ARButton.createButton(renderer, {
        requiredFeatures: ['local-floor','image-tracking'],
        trackedImages:    [{ image: markerImg, widthInMeters: 0.2 }]
      }) );

      // 5) Lighting & sphere (initially hidden)
      scene.add( new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1) );
      sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphere.visible = false;
      scene.add(sphere);

      // 6) On session start, get reference space
      renderer.xr.addEventListener('sessionstart', async () => {
        xrRefSpace = await renderer.xr.getSession().requestReferenceSpace('local-floor');
        document.getElementById('message').textContent = 'Point at your marker';
      });

      // 7) Render loop: track image each frame
      renderer.setAnimationLoop((time, frame) => {
        if (frame) {
          const results = frame.getImageTrackingResults();
          for (const result of results) {
            if (result.trackingState === 'tracked') {
              // show & pin sphere
              sphere.visible = true;
              document.getElementById('message').textContent = '✅ Marker tracked — sphere pinned';

              const pose = frame.getPose(result.imageSpace, xrRefSpace);
              if (pose) {
                // apply the exact image pose matrix
                sphere.matrix.fromArray(pose.transform.matrix);
                sphere.matrix.decompose(sphere.position, sphere.quaternion, sphere.scale);
                sphere.matrixAutoUpdate = false;
                pinned = true;
              }
            }
          }
          // once pinned, we no longer update its matrix,
          // so it stays fixed when marker is lost
        }
        renderer.render(scene, camera);
      });
    }
  </script>
</body>
</html>
