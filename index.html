<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NFT Marker Debug</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>body,html{margin:0;padding:0;overflow:hidden;width:100%;height:100}a-scene{width:100%;height:100}</style>
</head>
<body>
  <div id="debug" style="position:absolute;top:0;left:0;padding:.5em;color:#0f0;background:rgba(0,0,0,0.6);z-index:1">
    🔍 Loading marker files…
  </div>

  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;">
    <a-nft
      type="nft"
      url="marker"                             <!-- try full URL if this fails -->
      smooth="true"
      emitevents="true"
      onMarkerFound="document.getElementById('debug').innerText='✅ markerFound';"
      onMarkerLost="document.getElementById('debug').innerText='❌ markerLost';"
    >
      <a-box position="0 0.3 0" scale="0.5 0.5 0.5" material="color: red;"></a-box>
    </a-nft>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
