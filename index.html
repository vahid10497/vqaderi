<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MindAR - Anchor Content After Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #ar-container { position: relative; width: 100vw; height: 100vh; }
    #scanning-overlay {
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.5); 
      color: white; 
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div id="ar-container">
    <div id="scanning-overlay">Point camera at the target image</div>
    <canvas id="ar-canvas"></canvas>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let anchor = null;
      let model = null;
      let scene = null;
      let stoppedTracking = false;

      // Initialize MindAR with .mind file
      const mindarThree = new MindARThree({
        container: document.getElementById("ar-container"),
        imageTargetSrc: "./targets.mind", // Path to your compiled .mind file
      });

      const { renderer, scene: arScene, camera } = mindarThree;

      // Create a Three.js scene for virtual content
      scene = new THREE.Scene();

      // Add lighting
      const light = new THREE.AmbientLight(0xffffff, 1);
      scene.add(light);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);

      // Load 3D model (replace with your model)
      const loader = new THREE.GLTFLoader();
      loader.load(
        "https://example.com/your-model.glb", // REPLACE WITH YOUR MODEL
        (gltf) => {
          model = gltf.scene;
          model.visible = false; // Hide until anchor is found
          scene.add(model);
        }
      );

      // Start AR
      mindarThree.start().then(() => {
        console.log("AR started");
      });

      // Update loop
      const update = () => {
        if (stoppedTracking) {
          // If tracking stopped, render scene normally
          renderer.render(scene, camera);
        } else {
          // Otherwise, render AR scene
          mindarThree.update();
          renderer.render(arScene, camera);
        }
        requestAnimationFrame(update);
      };
      update();

      // Detect when target is found
      mindarThree.onTargetFound = () => {
        console.log("Target found!");
        document.getElementById("scanning-overlay").style.display = "none";

        // Get the anchor (position/orientation of the image)
        const anchorGroup = mindarThree.getAnchorGroup(0); // 0 = first target
        anchor = anchorGroup.position.clone(); // Store anchor position

        if (model) {
          // Position model at anchor
          model.position.copy(anchor);
          model.visible = true;

          // Optional: Stop tracking after 3 seconds
          setTimeout(() => {
            mindarThree.stop();
            stoppedTracking = true;
            console.log("Tracking stopped - object stays in place");
          }, 3000);
        }
      };

      // Reset if target lost (optional)
      mindarThree.onTargetLost = () => {
        if (!stoppedTracking) {
          document.getElementById("scanning-overlay").style.display = "flex";
        }
      };
    });
  </script>
</body>
</html>
