<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR True Pin & Forget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 1) A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- 2) MindAR.js core & A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
    a-scene     { width:100%; height:100%; }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- 1) Tracker + yellow box (only visible while the image is in view) -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (async () => {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      sceneEl.addEventListener('targetFound', async e => {
        // only once, only for targetIndex=0
        if (pinned || e.detail.index !== 0) return;
        pinned = true;

        // 1) Get world-space pose of the live yellow box
        const worldPos  = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        liveBox.object3D.getWorldPosition(worldPos);
        liveBox.object3D.getWorldQuaternion(worldQuat);

        // 2) Remove the entire tracker so MindAR never touches our anchor
        trackerEl.parentNode.removeChild(trackerEl);

        // 3) Create a brand-new red box and pin it at the captured world pose
        const pinnedBox = document.createElement('a-box');
        pinnedBox.setAttribute('depth',  '0.5');
        pinnedBox.setAttribute('height', '0.5');
        pinnedBox.setAttribute('width',  '0.5');
        pinnedBox.setAttribute('material','color: red;');
        // once it's loaded into the scene, set its object3D directly:
        pinnedBox.addEventListener('loaded', () => {
          pinnedBox.object3D.position.copy(worldPos);
          pinnedBox.object3D.quaternion.copy(worldQuat);
        });
        sceneEl.appendChild(pinnedBox);

        // 4) Stop MindAR’s image-tracker so it never clears again
        await sceneEl.components['mindar-image'].stop();
      });
    })();
  </script>
</body>
</html>
