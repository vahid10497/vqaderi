<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget (Scene Listener)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100% }
    a-scene { width:100%; height:100% }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + red box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="model"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: red;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    const modelEl   = document.getElementById('model');
    let pinned = false;

    console.log('▶️ Waiting for scene.targetFound…');
    sceneEl.addEventListener('targetFound', async (e) => {
      console.log('🔍 scene.targetFound', e.detail);
      // only once, only for targetIndex 0
      if (pinned || e.detail.index !== 0) return;
      pinned = true;

      // 1) Grab world pos & quat of tracker
      const worldPos = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();
      trackerEl.object3D.getWorldPosition(worldPos);
      trackerEl.object3D.getWorldQuaternion(worldQuat);
      console.log('📐 world pose:', worldPos, worldQuat);

      // 2) Create yellow box at that pose
      const anchorBox = document.createElement('a-box');
      anchorBox.setAttribute('position', `${worldPos.x} ${worldPos.y} ${worldPos.z}`);
      // convert to euler degrees
      const euler = new THREE.Euler().setFromQuaternion(worldQuat);
      anchorBox.setAttribute('rotation',
        `${THREE.MathUtils.radToDeg(euler.x)} ` +
        `${THREE.MathUtils.radToDeg(euler.y)} ` +
        `${THREE.MathUtils.radToDeg(euler.z)}`
      );
      anchorBox.setAttribute('depth', '0.5');
      anchorBox.setAttribute('height', '0.5');
      anchorBox.setAttribute('width', '0.5');
      anchorBox.setAttribute('material', 'color: yellow;');

      sceneEl.appendChild(anchorBox);
      console.log('➕ Yellow box pinned in world space.');

      // 3) Hide original red box + tracker
      modelEl.setAttribute('visible', 'false');
      trackerEl.setAttribute('visible', 'false');

      // 4) Stop MindAR so no further toggles occur
      await sceneEl.components['mindar-image'].stop();
      console.log('⏹️ MindAR stopped.');
    });
  </script>
</body>
</html>
