<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NFT Pin & Forget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame core -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js NFT build -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
    #debug {
      position: absolute; top:0; left:0;
      padding:0.5em; background:rgba(0,0,0,0.7);
      color:#0f0; font-family:monospace; z-index:1;
    }
  </style>
</head>
<body>
  <div id="debug">🔍 Waiting for marker…</div>

  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;">
    <a-nft
      type="nft"
      url="./Marker"
      smooth="true"
      emitevents="true"
      onMarkerFound="document.getElementById('debug').innerText='✅ Marker found';"
      onMarkerLost=" document.getElementById('debug').innerText='❌ Marker lost';"
    >
      <!-- This box follows the marker -->
      <a-box
        id="liveBox"
        position="0 0.5 0"
        scale="0.5 0.5 0.5"
        material="color: yellow;"
      ></a-box>
    </a-nft>

    <!-- AR.js camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Once the marker is found, pin & forget the box
    document.querySelector('a-nft').addEventListener('markerFound', () => {
      const scene = document.querySelector('a-scene');
      const liveBox = document.getElementById('liveBox');
      const nftEl = document.querySelector('a-nft');

      // 1) ensure matrices are up-to-date
      requestAnimationFrame(() => {
        scene.object3D.updateMatrixWorld(true);
        liveBox.object3D.updateWorldMatrix(true, false);

        // 2) grab its world-space matrix
        const m = liveBox.object3D.matrixWorld.clone();

        // 3) decompose into pos/quaternion
        const pos  = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        const scl  = new THREE.Vector3();
        m.decompose(pos, quat, scl);

        // 4) reparent under <a-scene>
        scene.appendChild(liveBox);

        // 5) reapply pose as attributes
        const euler = new THREE.Euler().setFromQuaternion(quat, 'XYZ');
        liveBox.setAttribute(
          'position',
          `${pos.x.toFixed(3)} ${pos.y.toFixed(3)} ${pos.z.toFixed(3)}`
        );
        liveBox.setAttribute(
          'rotation',
          `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.y).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`
        );

        // 6) remove the NFT tracker so the box stays in place
        nftEl.remove();
      });
    });
  </script>
</body>
</html>
