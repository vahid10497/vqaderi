<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Pin & Forget (localToWorld)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>body,html{margin:0;padding:0;overflow:hidden;width:100%;height:100}a-scene{width:100%;height:100}</style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + initial yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (function() {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      trackerEl.addEventListener('targetFound', () => {
        if (pinned) return;
        pinned = true;

        // 1) turn yellow → green
        liveBox.setAttribute('material','color: green;');

        // 2) wait one frame so MindAR has updated tracker transforms
        requestAnimationFrame(() => {
          // 3) Compute true scene-local world position of the green box
          const localPos = liveBox.object3D.position.clone();   // (0, .5, 0)
          const worldPos = liveBox.object3D.localToWorld(localPos);
          console.log('📐 liveBox localToWorld position:', worldPos);

          // 4) Spawn a blue box at exactly that worldPos
          const blueBox = document.createElement('a-box');
          blueBox.setAttribute('depth','0.5');
          blueBox.setAttribute('height','0.5');
          blueBox.setAttribute('width','0.5');
          blueBox.setAttribute('material','color: blue;');
          blueBox.setAttribute(
            'position',
            `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
          );
          sceneEl.appendChild(blueBox);
          console.log('✅ Blue box created:', blueBox);
          console.log('🔍 In scene now?', sceneEl.contains(blueBox));

          // 5) Clean up: remove tracker & pause MindAR
          setTimeout(async () => {
            trackerEl.remove();
            await sceneEl.components['mindar-image'].pause();
            console.log('⏹️ Tracker removed & MindAR paused');
            console.log('🔒 Blue box still in scene?', sceneEl.contains(blueBox));
          }, 1000);
        });
      });
    })();
  </script>
</body>
</html>
