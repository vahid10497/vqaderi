<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Manual Start Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100; background: #000; }
    #startButton {
      position: absolute; top:50%; left:50%;
      transform: translate(-50%, -50%);
      padding: 1em 2em;
      font-size: 1.2em;
      background: #28a;
      color: #fff;
      border: none;
      border-radius: 0.3em;
    }
    a-scene { display: none; }
  </style>
</head>
<body>
  <!-- 1) Manual start button -->
  <button id="startButton">Start AR</button>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; debugUIEnabled: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera look-controls="enabled: false"></a-camera>
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box position="0 0.5 0" depth="0.5" height="0.5" width="0.5" material="color: yellow;"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const startButton = document.getElementById('startButton');
    const sceneEl     = document.getElementById('scene');

    startButton.addEventListener('click', async () => {
      // Hide button, show scene
      startButton.style.display = 'none';
      sceneEl.style.display = 'block';

      // Trigger the camera permission prompt
      try {
        await sceneEl.components['mindar-image'].start();
        console.log('✅ MindAR started, camera should be live.');
      } catch (err) {
        console.error('❌ Could not start MindAR:', err);
        alert('Failed to start camera. Make sure you are on HTTPS and granted permission.');
      }
    });
  </script>
</body>
</html>
