<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MindAR on GitHub</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #ar-container { width: 100vw; height: 100vh; }
    #status {
      position: absolute; 
      top: 10px; left: 10px; 
      background: rgba(0,0,0,0.7); 
      color: white; 
      padding: 8px;
      font-family: Arial;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="status">Loading...</div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById("status");
      
      try {
        // 1. Test camera access first
        statusEl.textContent = "Checking camera...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach(track => track.stop());
        
        // 2. Initialize MindAR
        statusEl.textContent = "Initializing AR...";
        const mindarThree = new MindARThree({
          container: document.getElementById("ar-container"),
          imageTargetSrc: "targets.mind", // Same directory as HTML
        });

        const { renderer, scene, camera } = mindarThree;

        // 3. Add test cube
        const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        cube.visible = false;
        scene.add(cube);

        // 4. Start AR
        await mindarThree.start();
        statusEl.textContent = "Scan the target!";

        // 5. Track found/lost
        mindarThree.onTargetFound = () => {
          cube.visible = true;
          statusEl.textContent = "Target found!";
        };
        mindarThree.onTargetLost = () => {
          cube.visible = false;
        };

      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        console.error("AR failed:", err);
      }
    });
  </script>
</body>
</html>
