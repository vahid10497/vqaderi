<!DOCTYPE html>
<html>
  <head>
    <title>AR.js + GPS Sphere</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar-nft.js"></script>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      #gps-info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        background: rgba(0,0,0,0.5);
        padding: 0.5em;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="gps-info">Waiting for GPS...</div>
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; gpsMinAccuracy: 100; debugUIEnabled: false;"
    >
      <a-camera gps-camera rotation-reader></a-camera>

      <a-sphere
        gps-entity-place="latitude: 48.305596; longitude: 14.289124;"
        radius="0.1"
        color="orange"
      ></a-sphere>
    </a-scene>

    <script>
      // Show GPS status
      window.addEventListener('gps-camera-update-position', (e) => {
        const el = document.getElementById('gps-info');
        el.textContent = `GPS: ${e.detail.position.latitude.toFixed(6)}, ${e.detail.position.longitude.toFixed(6)}`;
      });
    </script>
  </body>
</html>
