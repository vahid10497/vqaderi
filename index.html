<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
  import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

  (async () => {
    // 1) Check support
    const imgOK = await navigator.xr.isSessionSupported('immersive-ar', {
      requiredFeatures: ['image-tracking']
    });

    // 2) Load image if supported
    let trackedImages = [];
    if (imgOK) {
      const img = new Image();
      img.src = './marker.png';
      await img.decode();
      trackedImages = [{ image: img, widthInMeters: 0.2 }];
    }

    // 3) Three.js + ARButton
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera();
    const renderer = new THREE.WebGLRenderer({ alpha:true });
    document.body.appendChild(renderer.domElement);
    renderer.xr.enabled = true;
    document.body.appendChild(ARButton.createButton(renderer, {
      requiredFeatures: imgOK ? ['local-floor','image-tracking'] : ['local-floor'],
      trackedImages:    imgOK ? trackedImages              : undefined
    }));

    // 4) Sphere to track
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.1,32,16),
      new THREE.MeshStandardMaterial({ color: 0xff6600 })
    );
    sphere.visible = false;
    scene.add(sphere);
    scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));

    let xrRefSpace;
    renderer.xr.addEventListener('sessionstart', async () => {
      xrRefSpace = await renderer.xr.getSession().requestReferenceSpace('local-floor');
    });

    // 5) Render loop
    renderer.setAnimationLoop((_, frame) => {
      if (frame && imgOK) {
        for (const result of frame.getImageTrackingResults()) {
          if (result.trackingState === 'tracked') {
            const pose = frame.getPose(result.imageSpace, xrRefSpace);
            if (pose) {
              sphere.visible = true;
              sphere.matrix.fromArray(pose.transform.matrix);
              sphere.matrix.decompose(sphere.position, sphere.quaternion, sphere.scale);
              sphere.matrixAutoUpdate = false;
            }
          }
        }
      }
      renderer.render(scene, camera);
    });
  })();
</script>
