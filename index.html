<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Pin & Forget (Blue Offset)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + brown live box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: brown;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (async () => {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      trackerEl.addEventListener('targetFound', () => {
        if (pinned) return;
        pinned = true;

        // 1) Turn live box green
        liveBox.setAttribute('material','color: green;');

        // 2) Grab world-space pose of the live box
        const pos = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        liveBox.object3D.getWorldPosition(pos);
        liveBox.object3D.getWorldQuaternion(quat);

        // 3) Create blue box with an X-offset +0.5m
        const blueBox = document.createElement('a-box');
        blueBox.setAttribute('depth', '0.5');
        blueBox.setAttribute('height','0.5');
        blueBox.setAttribute('width', '0.5');
        blueBox.setAttribute('material','color: blue;');
        // Apply offset on X axis of world quaternion
        const offset = new THREE.Vector3(0.5, 0, 0).applyQuaternion(quat);
        const bx = pos.x + offset.x;
        const by = pos.y + offset.y;
        const bz = pos.z + offset.z;
        blueBox.setAttribute('position',
          `${bx.toFixed(3)} ${by.toFixed(3)} ${bz.toFixed(3)}`
        );
        // derive Euler for rotation
        const euler = new THREE.Euler().setFromQuaternion(quat, 'XYZ');
        blueBox.setAttribute('rotation',
          `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.y).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`
        );

        // 4) Append the blue box immediately
        sceneEl.appendChild(blueBox);

        // 5) After 3s, remove tracker + pause MindAR
        setTimeout(async () => {
          if (trackerEl.parentNode) trackerEl.parentNode.removeChild(trackerEl);
          await sceneEl.components['mindar-image'].pause();
        }, 3000);
      });
    })();
  </script>
</body>
</html>
