<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>WebXR Image-Tracking + Pin & Forget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; }
    #message {
      position:absolute; top:0; width:100%; padding:1em;
      background:rgba(0,0,0,0.6); color:white; text-align:center;
      font-family:sans-serif; z-index:1;
    }
  </style>
</head>
<body>
  <div id="message">Initializing…</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    let renderer, scene, camera;
    let xrRefSpace, xrHitTestSource, trackedImageSet, trackedObject;
    let pinned = false;

    init();
    async function init() {
      // 1) Three.js setup
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('xr-canvas'), alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;

      // 2) Light + red box
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
      trackedObject = new THREE.Mesh(
        new THREE.BoxGeometry(0.2,0.2,0.2),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );
      trackedObject.visible = false;
      scene.add(trackedObject);

      // 3) AR Button with image-tracking feature
      document.body.appendChild( ARButton.createButton(renderer, {
        requiredFeatures: ['image-tracking'],
        trackedImages: await loadMarkerImage('./marker.png')
      }) );

      renderer.xr.addEventListener('sessionstart', onSessionStart);
      renderer.setAnimationLoop(render);
    }

    // Load the marker image into an XRTrackedImageInit
    async function loadMarkerImage(url) {
      const img = new Image();
      img.src = url;
      await img.decode();
      return [{image: img, widthInMeters: 0.2}];
    }

    function onSessionStart() {
      const session = renderer.xr.getSession();
      xrRefSpace = renderer.xr.getReferenceSpace();
      // grab trackedImages set
      trackedImageSet = session.trackedImages;
      document.getElementById('message').innerText = 'Point at the marker image';
    }

    function render(timestamp, frame) {
      const session = renderer.xr.getSession();
      const trackedImages = frame.getImageTrackingResults();
      if (trackedImages.length > 0) {
        for (const result of trackedImages) {
          const state = result.trackingState; // "tracked", "emulated", or "not-tracked"
          if (state === 'tracked') {
            // get pose of the image in world space
            const pose = frame.getPose(result.imageSpace, xrRefSpace);
            if (pose) {
              // apply pose to our box
              trackedObject.visible = true;
              trackedObject.matrix.fromArray(pose.transform.matrix);
              trackedObject.matrixAutoUpdate = false;
              pinned = true; // we’ve seen it
            }
          }
        }
      } else if (pinned) {
        // image lost after being tracked → leave the box in place
        document.getElementById('message').innerText = '🔒 Object pinned';
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
