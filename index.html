<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebXR Geolocation Anchor</title>
  <style>
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    #lockButton {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 10px;
      background: white;
      border: 1px solid #ccc;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="lockButton">Lock Object Here</button>
  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.158.0';
    import { ARButton } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let controller;
    let reticle;
    let lockedObject = null;
    let gpsTarget = { lat: 48.305596, lon: 14.289124 }; // Replace with your location
    let userPos = null;
    let objectPlaced = false;

    init();
    getLocation();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(ARButton.createButton(renderer));

      controller = renderer.xr.getController(0);
      scene.add(controller);

      const geometry = new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      document.getElementById('lockButton').addEventListener('click', () => {
        if (userPos && !objectPlaced) {
          const worldPosition = gpsToWorld(userPos, gpsTarget);
          lockedObject = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.3, 0.3),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
          );
          lockedObject.position.set(worldPosition.x, 0, worldPosition.z);
          scene.add(lockedObject);
          objectPlaced = true;
        }
      });

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    }

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(position => {
          userPos = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
          };
        }, console.error, { enableHighAccuracy: true });
      }
    }

    function gpsToWorld(user, target) {
      const R = 6371000; // Earth radius in meters
      const dLat = (target.lat - user.lat) * Math.PI / 180;
      const dLon = (target.lon - user.lon) * Math.PI / 180;
      const lat1 = user.lat * Math.PI / 180;
      const lat2 = target.lat * Math.PI / 180;

      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.sin(dLon/2) * Math.sin(dLon/2) * Math.cos(lat1) * Math.cos(lat2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distance = R * c;

      const bearing = Math.atan2(
        Math.sin(dLon) * Math.cos(lat2),
        Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon)
      );

      return {
        x: distance * Math.sin(bearing),
        z: distance * Math.cos(bearing)
      };
    }
  </script>
</body>
</html>
