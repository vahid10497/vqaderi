<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>AR.js GPS Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- 1) A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- 2) AR.js (GPS + marker + location) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.0/aframe/build/aframe-ar.js"></script>
    <style>body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden}</style>
  </head>
  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="
        sourceType: webcam;
        debugUIEnabled: true;
        gpsMinDistance: 5;
        gpsMinAccuracy: 100;
      "
    >
      <!-- GPS‐Camera must be present to drive GPS‐Entity‐Place -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- A simple sphere at your building coords + 3m up -->
      <a-sphere
        gps-entity-place="latitude:48.29002038491218; longitude:14.282757518735202"
        position="0 4 0"
        radius="5"
        color="#FF6600"
      ></a-sphere>
    </a-scene>
  </body>
</html>
