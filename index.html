<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR AnchorHack on v1049</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js core + A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + initial brown box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: brown;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (async () => {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      trackerEl.addEventListener('targetFound', () => {
        if (pinned) return;
        pinned = true;

        // 1) Immediate feedback: brown→green
        liveBox.setAttribute('material','color: green;');

        // 2) HACK: get MindAR's raw anchor matrix (clean meters)
        const mindarSys = sceneEl.systems.mindarImage;
        const anchor    = mindarSys.imageTracker.anchorList.get(0);
        const matArr    = anchor.anchorMatrix;              // Float32Array[16]
        const mat       = new THREE.Matrix4().fromArray(matArr);

        // Decompose into position & quaternion
        const worldPos  = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        const worldScl  = new THREE.Vector3();
        mat.decompose(worldPos, worldQuat, worldScl);

        // Convert quat → Euler for A-Frame
        const euler     = new THREE.Euler().setFromQuaternion(worldQuat, 'XYZ');
        const rx        = THREE.MathUtils.radToDeg(euler.x).toFixed(1);
        const ry        = THREE.MathUtils.radToDeg(euler.y).toFixed(1);
        const rz        = THREE.MathUtils.radToDeg(euler.z).toFixed(1);

        // 3) Spawn permanent red box at the exact anchor pose
        const redBox = document.createElement('a-box');
        redBox.setAttribute('depth','0.5');
        redBox.setAttribute('height','0.5');
        redBox.setAttribute('width','0.5');
        redBox.setAttribute('material','color: red;');
        redBox.setAttribute('position',
          `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
        );
        redBox.setAttribute('rotation', `${rx} ${ry} ${rz}`);
        sceneEl.appendChild(redBox);

        // 4) Delay removal & pause by 3 seconds
        setTimeout(async () => {
          if (trackerEl.parentNode) trackerEl.parentNode.removeChild(trackerEl);
          await sceneEl.components['mindar-image'].pause();
        }, 3000);
      });
    })();
  </script>
</body>
</html>
