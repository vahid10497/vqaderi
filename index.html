<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Keep &amp; Detach Green Box</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body,html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + initial yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
  (function() {
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    const liveBox   = document.getElementById('liveBox');
    let pinned = false;
    let logInterval;

    console.log('▶️ Waiting for tracker.targetFound…');

    trackerEl.addEventListener('targetFound', async () => {
      console.log('🎯 tracker.targetFound fired');
      if (pinned) {
        console.log('⚠️ Already pinned, skipping.');
        return;
      }
      pinned = true;

      // 1) Turn box yellow → green
      console.log('1) liveBox: yellow → green');
      liveBox.setAttribute('material','color: green;');

      // 2) Wait one RAF tick to let AR update transforms
      requestAnimationFrame(async () => {
        // 3) Compute and bake its world‐space position + rotation
        const worldPos  = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        liveBox.object3D.getWorldPosition(worldPos);
        liveBox.object3D.getWorldQuaternion(worldQuat);

        // 4) Reparent liveBox to scene root so it’s independent
        sceneEl.appendChild(liveBox);
        console.log(`2) liveBox reparented. Position: x=${worldPos.x.toFixed(3)}, y=${worldPos.y.toFixed(3)}, z=${worldPos.z.toFixed(3)}`);

        // Apply explicit attributes so it holds that pose
        const euler = new THREE.Euler().setFromQuaternion(worldQuat, 'XYZ');
        liveBox.setAttribute('position', 
          `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
        );
        liveBox.setAttribute('rotation',
          `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.y).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`
        );

        // 5) Remove the tracker completely
        trackerEl.remove();
        console.log('3) Tracker removed.');

        // 6) Pause MindAR so it stops clearing the scene
        await sceneEl.components['mindar-image'].pause();
        console.log('4) MindAR paused.');

        // 7) Start logging the box’s position every 5 seconds
        logInterval = setInterval(() => {
          const checkPos = new THREE.Vector3();
          liveBox.object3D.getWorldPosition(checkPos);
          console.log(`🔄 liveBox still present. Position: x=${checkPos.x.toFixed(3)}, y=${checkPos.y.toFixed(3)}, z=${checkPos.z.toFixed(3)}`);
          console.log('🔒 liveBox in scene?', sceneEl.contains(liveBox));
        }, 5000);
      });
    });
  })();
  </script>
</body>
</html>
