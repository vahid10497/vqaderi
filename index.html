<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true;">
  <a-camera></a-camera>
  <!-- tracker holds your live box -->
  <a-entity id="tracker" mindar-image-target="targetIndex: 0">
    <a-box id="liveBox" position="0 0.5 0" material="color: yellow;"></a-box>
  </a-entity>
</a-scene>

<script>
  const sceneEl   = document.querySelector('a-scene');
  const trackerEl = document.getElementById('tracker');

  sceneEl.addEventListener('targetFound', () => {
    // 1) get the MindAR component
    const mindar = sceneEl.components['mindar-image'];

    // 2) grab the raw anchor matrix for targetIndex=0
    const anchor = mindar.imageTracker.anchorList.get(0);
    const matArr = anchor.anchorMatrix;

    // 3) decompose it
    const m = new THREE.Matrix4().fromArray(matArr);
    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scale = new THREE.Vector3();
    m.decompose(pos, quat, scale);

    console.log('🔢 Anchor pos:', pos);
    console.log('🌀 Anchor quat:', quat);

    // 4) reparent your box under scene and snap it to pos+quat
    const liveBox = document.getElementById('liveBox');
    sceneEl.appendChild(liveBox);
    liveBox.object3D.position.copy(pos);
    liveBox.object3D.quaternion.copy(quat);

    // now the box is truly locked in world-space
    // you can even remove the tracker if you like:
    trackerEl.remove();
  });
</script>
