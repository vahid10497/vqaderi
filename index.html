<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget (Fixed)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 1) A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- 2) MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
    a-scene { width:100%; height:100%; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
    "
    device-orientation-permission-ui="enabled: true"
    vr-mode-ui="enabled: false"
    debugUIEnabled="true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker entity -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0" visible="true">
      <a-box
        id="model"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: red;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (function() {
      const sceneEl = document.querySelector('a-scene');
      const trackerEl = document.getElementById('tracker');
      const modelEl = document.getElementById('model');
      let pinned = false;

      sceneEl.addEventListener('targetFound', async (event) => {
        // only for targetIndex 0, and only once
        if (pinned || event.detail.index !== 0) return;
        pinned = true;

        // 1) Capture world matrix of the tracker entity
        const worldMatrix = trackerEl.object3D.matrixWorld.clone();

        // 2) Create a new anchor entity and clone the model into it
        const anchor = document.createElement('a-entity');
        const clone = modelEl.cloneNode(true);
        anchor.appendChild(clone);

        // 3) Apply the captured world transform
        anchor.object3D.matrix.copy(worldMatrix);
        anchor.object3D.matrix.decompose(
          anchor.object3D.position,
          anchor.object3D.quaternion,
          anchor.object3D.scale
        );

        // 4) Append anchor to the scene root
        sceneEl.appendChild(anchor);

        // 5) Hide the original tracker so it never toggles its children
        trackerEl.setAttribute('visible', 'false');

        // 6) Stop MindAR’s image-tracking to prevent any further hides
        await sceneEl.components['mindar-image'].stop();

        console.log('✅ Pinned model in world space and stopped tracking.');
      });
    })();
  </script>
</body>
</html>
