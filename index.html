<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js NFT Marker Example</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Use AR.js build with NFT support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      
      <!-- NFT marker here -->
      <a-nft 
        type="nft" 
        url="./marker"  <!-- your marker files prefix here without extension -->
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5"
      >
        <a-entity
          position="0 0 0"
          scale="0.05 0.05 0.05"
          gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"
        ></a-entity>
      </a-nft>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
