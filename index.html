<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Geo+SLAM Anchor Inside RenderLoop</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif }
    #status {
      position:absolute; top:0; left:0; right:0;
      background:rgba(0,0,0,0.6); color:#fff;
      padding:0.5em; text-align:center; z-index:10;
      pointer-events:none;
    }
    #debug-log {
      position:fixed; bottom:0; left:0; right:0;
      max-height:40%; overflow-y:auto;
      background:rgba(0,0,0,0.8); color:#fff;
      font-family:monospace; font-size:12px;
      padding:4px; z-index:9999; pointer-events:none;
    }
    canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <div id="status">🔍 Starting…</div>
  <div id="debug-log"></div>
  <canvas id="xr-canvas"></canvas>

  <!-- on-screen console -->
  <script>
    (function(){
      const logEl = document.getElementById('debug-log');
      ['log','warn','error'].forEach(l=>{
        const o=console[l].bind(console);
        console[l]=(...a)=>{
          o(...a);
          const msg=a.map(x=>{
            try{ return typeof x==='string'?x:JSON.stringify(x) }catch{ return String(x) }
          }).join(' ');
          const d=document.createElement('div');
          d.textContent=`[${l}] ${msg}`;
          if(l==='error') d.style.color='salmon';
          if(l==='warn')  d.style.color='khaki';
          logEl.appendChild(d);
          logEl.scrollTop=logEl.scrollHeight;
        };
      });
    })();
  </script>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    const TARGET_LAT = 48.28961166630169;
    const TARGET_LON = 14.282566825905297;
    const MODEL_HEIGHT = 3;     // meters above floor
    const FALLBACK_DIST = 2;    // meters in front

    const statusEl = document.getElementById('status');
    const setStatus = t => { statusEl.textContent = t; console.log(t); };

    let scene, camera, renderer;
    let xrRefSpace;
    let geoSphere, fallbackSphere;
    let userLat, userLon, heading;
    let anchorTried = false, xrAnchor = null;

    // Helpers
    function latLonToENU(lat,lon,lat0,lon0){
      const R=6378137;
      const dLat=THREE.MathUtils.degToRad(lat-lat0),
            dLon=THREE.MathUtils.degToRad(lon-lon0);
      return {
        east:  dLon*R*Math.cos(THREE.MathUtils.degToRad(lat0)),
        north: dLat*R
      };
    }

    // 1) GPS + Compass
    async function initSensors(){
      setStatus('📍 Getting GPS…');
      await new Promise((r,re)=> {
        if(!navigator.geolocation) return re('No GPS');
        navigator.geolocation.getCurrentPosition(p=>{
          userLat = p.coords.latitude;
          userLon = p.coords.longitude;
          setStatus(`📍 GPS: ${userLat.toFixed(6)},${userLon.toFixed(6)}`);
          r();
        },()=>re('GPS error'));
      });

      setStatus('🧭 Waiting compass…');
      await new Promise(r=>{
        window.addEventListener('deviceorientationabsolute', ev=>{
          if(ev.alpha!=null){
            heading = ev.alpha;
            setStatus(`🧭 Heading: ${heading.toFixed(1)}°`);
            r();
          }
        },{once:true});
      });
    }

    // 2) Three + ARButton
    function initThree(){
      setStatus('🎨 Init Three.js…');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas:document.getElementById('xr-canvas'),
        alpha:true, antialias:true
      });
      renderer.xr.enabled=true;
      renderer.setSize(window.innerWidth,window.innerHeight);

      const btn=ARButton.createButton(renderer,{
        requiredFeatures:['local-floor','anchors']
      });
      btn.style.zIndex=10000;
      document.body.appendChild(btn);

      scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));
    }

    // 3) Model prep
    function initModel(){
      geoSphere=new THREE.Mesh(
        new THREE.SphereGeometry(0.3,32,16),
        new THREE.MeshStandardMaterial({color:0xff6600})
      );
      geoSphere.visible=false;
      scene.add(geoSphere);

      fallbackSphere=geoSphere.clone();
      fallbackSphere.material=new THREE.MeshStandardMaterial({color:0x00ff00});
      fallbackSphere.visible=false;
      scene.add(fallbackSphere);
    }

    // 4) Render & anchor inside loop
    function onXRFrame(t,frame){
      const session = frame.session;
      if(!anchorTried){
        anchorTried=true;
        setStatus('▶️ First XRFrame—trying anchor');
        session.requestReferenceSpace('local-floor')
          .then(ref=>{ xrRefSpace=ref; })
          .then(()=>{
            // ENU
            const {east,north} = latLonToENU(
              TARGET_LAT,TARGET_LON,userLat,userLon
            );
            console.log('ENU',east,north);

            // rotation from heading
            const hRad=THREE.MathUtils.degToRad(heading||0);
            const rot=new THREE.Quaternion().setFromEuler(
              new THREE.Euler(0,-hRad,0,'YXZ')
            );

            // build XRRigidTransform
            const xf=new XRRigidTransform(
              { x:east, y:MODEL_HEIGHT, z:-north },
              { x:rot.x,y:rot.y,z:rot.z,w:rot.w }
            );

            // now createAnchor
            frame.createAnchor(xf,xrRefSpace).then(a=>{
              xrAnchor=a;
              setStatus('✅ Anchor created—orange sphere visible');
              geoSphere.visible=true;
            }).catch(err=>{
              console.warn('Anchor failed:',err);
              setStatus('⚠️ Anchor failed—green fallback');
              // fallback instantly
              const cam=renderer.xr.getCamera(camera);
              const dir=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
              const pos=new THREE.Vector3().copy(cam.position)
                         .add(dir.multiplyScalar(FALLBACK_DIST));
              fallbackSphere.position.copy(pos);
              fallbackSphere.quaternion.copy(cam.quaternion);
              fallbackSphere.visible=true;
            });
          });
      }

      // update anchored sphere
      if(xrAnchor){
        const pose = frame.getPose(xrAnchor.anchorSpace,xrRefSpace);
        if(pose){
          geoSphere.matrix.fromArray(pose.transform.matrix);
          geoSphere.matrix.decompose(
            geoSphere.position,geoSphere.quaternion,geoSphere.scale
          );
          geoSphere.matrixAutoUpdate=false;
          console.log(
            `Orange at x=${geoSphere.position.x.toFixed(2)},`+
            `y=${geoSphere.position.y.toFixed(2)},`+
            `z=${geoSphere.position.z.toFixed(2)}`
          );
        } else console.warn('No anchor pose this frame');
      }

      // fallback update (static in front)
      if(fallbackSphere.visible){
        console.log(
          `Green at x=${fallbackSphere.position.x.toFixed(2)},`+
          `y=${fallbackSphere.position.y.toFixed(2)},`+
          `z=${fallbackSphere.position.z.toFixed(2)}`
        );
      }

      renderer.render(scene,camera);
    }

    // 5) Boot
    (async()=>{
      try{
        await initSensors();
      }catch(e){
        return setStatus(`❌ Sensor init error: ${e}`);
      }
      initThree();
      initModel();
      renderer.xr.setAnimationLoop(onXRFrame);
      setStatus('Tap ENTER AR');
    })();

    window.addEventListener('resize', ()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  </script>
</body>
</html>
