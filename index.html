<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GPS AR with Stabilization (No Fixing)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <!-- Main Sphere - rooftop object -->
      <a-sphere
        id="mainSphere"
        radius="4"
        color="#0077FF"
        look-at="[gps-camera]"
        scale="1 1 1"
      ></a-sphere>

      <!-- Debug small red sphere at exact GPS anchor -->
      <a-sphere
        id="debugSphere"
        radius="0.5"
        color="#FF0000"
      ></a-sphere>

      <!-- Status Text -->
      <a-text
        id="statusText"
        value="Waiting for GPS fix..."
        position="0 25 0"
        scale="8 8 8"
        color="#FFFFFF"
        look-at="[gps-camera]"
      ></a-text>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      // Target GPS coords (building rooftop)
      const targetLatitude = 48.28961166630169;
      const targetLongitude = 14.282566825905297;
      const targetAltitude = 20; // meters above ground

      const minDistance = 3; // meters, minimum distance to update position
      let lastPosition = null;

      const sphere = document.getElementById('mainSphere');
      const debugSphere = document.getElementById('debugSphere');
      const statusText = document.getElementById('statusText');

      // Haversine formula to calculate distance between two GPS coords in meters
      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; // Earth radius in meters
        const toRad = (deg) => (deg * Math.PI) / 180;

        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);

        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(toRad(lat1)) *
            Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c;
      }

      // Update function to move sphere if device moved enough
      function updatePosition(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const alt = position.coords.altitude || 0;

        // Calculate distance from last position
        if (lastPosition) {
          const dist = getDistance(lat, lon, lastPosition.latitude, lastPosition.longitude);
          if (dist < minDistance) {
            // Ignore small moves (GPS noise)
            return;
          }
        }

        lastPosition = { latitude: lat, longitude: lon };

        // Calculate relative position of target from device position
        // Using AR.js gps-entity-place does this automatically, but here we manually set the sphere's position.

        // Set the sphere's GPS place attribute (updates position automatically)
        sphere.setAttribute('gps-entity-place', `latitude: ${targetLatitude}; longitude: ${targetLongitude};`);

        // Because altitude can be off, manually set Y to targetAltitude (building height)
        sphere.setAttribute('position', `0 ${targetAltitude} 0`);

        debugSphere.setAttribute('gps-entity-place', `latitude: ${targetLatitude}; longitude: ${targetLongitude};`);
        debugSphere.setAttribute('position', `0 ${targetAltitude} 0`);

        statusText.setAttribute('value', `GPS updated at lat:${lat.toFixed(5)} lon:${lon.toFixed(5)}`);
      }

      // Listen to device GPS updates via gps-camera events
      document.querySelector('a-camera').addEventListener('gps-camera-update-position', (e) => {
        updatePosition(e.detail.position);
      });
    </script>
  </body>
</html>
