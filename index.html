<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><title>ARButton Test</title></head>
<body style="margin:0;overflow:hidden;">
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
  import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

  // 1) Setup renderer
  const renderer = new THREE.WebGLRenderer({ alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // 2) Simple scene
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();
  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

  // 3) ARButton (no image‐tracking, no geospatial)
  document.body.appendChild(
    ARButton.createButton(renderer, { requiredFeatures: ['local-floor'] })
  );

  // 4) Render loop
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
