<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pin & Forget (Full Screen)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR core & A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      a-scene {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      debugUIEnabled="false"
      /* embedded removed so it goes full screen */
    >
      <a-camera look-controls="enabled: false"></a-camera>

      <!-- Tracker with your content -->
      <a-entity id="tracker" mindar-image-target="targetIndex: 0">
        <a-box id="trackerContent" position="0 0.5 0" color="orange"></a-box>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl   = document.querySelector('a-scene');
      const trackerEl = document.getElementById('tracker');
      const contentEl = document.getElementById('trackerContent');
      let pinnedEl;

      trackerEl.addEventListener('targetFound', () => {
        if (pinnedEl) return;  // only pin once

        // capture world matrix
        const worldMatrix = trackerEl.object3D.matrixWorld.clone();

        // create pinned entity
        pinnedEl = document.createElement('a-entity');
        const clone = contentEl.cloneNode(true);
        pinnedEl.appendChild(clone);

        // apply transform
        pinnedEl.object3D.matrix.copy(worldMatrix);
        pinnedEl.object3D.matrix.decompose(
          pinnedEl.object3D.position,
          pinnedEl.object3D.quaternion,
          pinnedEl.object3D.scale
        );

        // add to scene and hide tracker
        sceneEl.appendChild(pinnedEl);
        trackerEl.setAttribute('visible', 'false');
      });
    </script>
  </body>
</html>
