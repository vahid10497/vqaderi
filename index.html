<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR GPS to Surface</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // After 20 seconds, hide GPS AR, show WebXR
      setTimeout(() => {
        document.getElementById("gps-ar").style.display = "none";
        document.getElementById("webxr-ar").style.display = "block";
      }, 20000);
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #webxr-ar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>

  <body>
    <!-- AR.js GPS Scene -->
    <a-scene
      id="gps-ar"
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      embedded
    >
      <a-entity
        gps-entity-place="latitude: 48.29001756836221; longitude: 14.282756650237488;"
        gltf-model="My_model.glb"
        scale="5 5 5"
        rotation="0 180 0"
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <!-- model-viewer WebXR AR -->
    <div id="webxr-ar">
      <model-viewer
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y"
        src="My_model.glb"
        alt="3D model"
        auto-rotate
        scale="5 5 5"
        style="width: 100%; height: 100%"
      ></model-viewer>
    </div>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </body>
</html>
