<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 1) A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- 2) MindAR core & A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
    a-scene     { width:100%; height:100%; }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + live yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (async () => {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      sceneEl.addEventListener('targetFound', async ({ detail }) => {
        if (pinned || detail.index !== 0) return;
        pinned = true;

        // 1) Turn the live box green to mark detection
        liveBox.setAttribute('material', 'color: green;');

        // 2) Capture world-space pose of the liveBox
        const worldPos  = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        liveBox.object3D.getWorldPosition(worldPos);
        liveBox.object3D.getWorldQuaternion(worldQuat);

        // Convert quaternion to Euler for attribute
        const euler = new THREE.Euler().setFromQuaternion(worldQuat, 'XYZ');
        const rotX = THREE.MathUtils.radToDeg(euler.x).toFixed(1);
        const rotY = THREE.MathUtils.radToDeg(euler.y).toFixed(1);
        const rotZ = THREE.MathUtils.radToDeg(euler.z).toFixed(1);

        // 3) Create and configure the pinned blue box
        const pinnedBox = document.createElement('a-box');
        pinnedBox.setAttribute('position',
          `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
        );
        pinnedBox.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`);
        pinnedBox.setAttribute('depth',  '0.5');
        pinnedBox.setAttribute('height', '0.5');
        pinnedBox.setAttribute('width',  '0.5');
        pinnedBox.setAttribute('material', 'color: blue;');

        // 4) Add the blue box under <a-scene>
        sceneEl.appendChild(pinnedBox);

        // 5) Remove the original tracker so it never toggles again
        trackerEl.parentNode.removeChild(trackerEl);

        // 6) Pause MindAR’s tracking loop
        await sceneEl.components['mindar-image'].pause();
      });
    })();
  </script>
</body>
</html>
