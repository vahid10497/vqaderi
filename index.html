<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js GPS Anchor Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js A-Frame + GPS support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
      a-scene     { width: 100%; height: 100%; }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; gpsMinDistance: 5; debugUIEnabled: false;"
    >
      <!-- 
        Simulate your camera at your first-floor window coordinates 
        (replace simulateLatitude/Longitude with your real location or remove them for live GPS)
      -->
      <a-camera
        gps-camera="simulateLatitude: 48.29001756836221; simulateLongitude: 14.282756650237488"
        rotation-reader
      ></a-camera>

      <!-- 
        Place a big red sphere at the rooftop coordinates 
        (48.28961166630169, 14.282566825905297) 
      -->
      <a-sphere
        color="red"
        radius="2"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
      ></a-sphere>
    </a-scene>
  </body>
</html>
