<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindARThree Pin & Forget (Final)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; }
    #start {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      padding:1em 2em; font-size:1.2em;
      background:#28a; color:#fff; border:none; border-radius:4px;
      z-index:2;
    }
    #debug {
      position:absolute; top:0; left:0; padding:0.5em;
      background:rgba(0,0,0,0.7); color:#0f0; font-family:monospace;
      z-index:2;
    }
  </style>
</head>
<body>
  <button id="start">Start AR</button>
  <div id="debug">🔍 Waiting to start…</div>

  <script type="module">
    import * as THREE      from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

    const startButton = document.getElementById('start');
    const debug       = document.getElementById('debug');

    startButton.addEventListener('click', async () => {
      startButton.style.display = 'none';
      debug.innerText = '🚀 Initializing AR…';

      // 1) Initialize MindARThree
      const mindarThree = new MindARThree({
        container: document.body,
        imageTargetSrc: './targets.mind',
        maxTrack: 1,
        uiLoading: false,
        uiScanning: false
      });
      const { renderer, scene, camera } = mindarThree;

      // 2) Add ambient light
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // 3) Create an anchor group for your image (index 0)
      const anchor = mindarThree.addAnchor(0);

      // 4) Add a live yellow box inside the anchor
      const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const matLive = new THREE.MeshStandardMaterial({ color: 'yellow' });
      const liveBox = new THREE.Mesh(geo, matLive);
      liveBox.position.set(0, 0.1, 0);
      anchor.group.add(liveBox);

      // 5) When the image is first found, clone & pin a red box
      let pinned = false;
      anchor.onTargetFound = () => {
        if (pinned) return;
        pinned = true;
        debug.innerText = '✅ Image found — pinning red box…';

        // Clone geometry & make a red material
        const matRed = new THREE.MeshStandardMaterial({ color: 'red' });
        const redBox = new THREE.Mesh(geo, matRed);

        // Copy the world-matrix of the anchor group into our red box
        redBox.applyMatrix4(anchor.group.matrixWorld);
        redBox.matrixAutoUpdate = false;   // freeze transform
        scene.add(redBox);

        // After 3s, remove live box & stop the tracker
        setTimeout(async () => {
          anchor.group.remove(liveBox);
          await mindarThree.stop();
          debug.innerText = '📌 Tracker stopped — red box remains.';
        }, 3000);
      };

      // 6) Start AR and camera loop
      await mindarThree.start();
      debug.innerText = '🎥 Camera live — point at your image';
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    });
  </script>
</body>
</html>
