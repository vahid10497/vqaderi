<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MindAR Pin & Forget (Position Only)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR core & A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
      a-scene  { width:100%; height:100%; position:absolute; top:0; left:0; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      debugUIEnabled="false"
    >
      <a-camera look-controls="enabled: false"></a-camera>

      <!-- Tracker (empty) -->
      <a-entity id="tracker" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      (async () => {
        const sceneEl   = document.querySelector('a-scene');
        const trackerEl = document.getElementById('tracker');
        let pinned = false;

        trackerEl.addEventListener('targetFound', async () => {
          if (pinned) return;
          pinned = true;

          // 1) Get world position of the tracker
          const worldPos = new THREE.Vector3();
          trackerEl.object3D.getWorldPosition(worldPos);

          // 2) Create the sphere and position it
          const sphere = document.createElement('a-sphere');
          sphere.setAttribute('position',
            `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
          );
          sphere.setAttribute('radius', '0.2');
          sphere.setAttribute('color', 'yellow');

          // 3) Add it outside the tracker
          sceneEl.appendChild(sphere);

          // 4) Stop MindAR so it never hides or searches again
          await sceneEl.components['mindar-image'].stop();

          console.log('✅ Sphere pinned at', worldPos);
        });
      })();
    </script>
  </body>
</html>
