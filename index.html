<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GeoAR.js demo</title>

    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Look-at component, not critical but can be useful -->
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <!-- AR.js for NFT / AR support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <!-- Custom component to pin model after 20 seconds -->
    <script>
      AFRAME.registerComponent('pin-after-delay', {
        init: function () {
          const model = this.el;

          // Wait for the 3D model to fully load before proceeding
          model.addEventListener('model-loaded', () => {
            setTimeout(() => {
              const scene = document.querySelector('a-scene');
              const THREE = AFRAME.THREE || window.THREE;

              if (!THREE) {
                console.error("THREE.js not found.");
                return;
              }

              // Get model's current world position
              const worldPos = new THREE.Vector3();
              model.object3D.getWorldPosition(worldPos);

              // Remove GPS tracking so model stops following GPS updates
              model.removeAttribute('gps-entity-place');

              // Convert world position to scene-local coordinates
              const localPos = scene.object3D.worldToLocal(worldPos.clone());

              // Fix model position in the scene
              model.setAttribute('position', `${localPos.x} ${localPos.y} ${localPos.z}`);

              console.log("Model pinned at local position:", localPos);
            }, 20000); // Pin after 20 seconds
          });
        }
      });
    </script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <a-entity
        id="model"
        gps-entity-place="latitude: 48.29001756836221; longitude: 14.282756650237488;"
        gltf-model="My_model.glb"
        scale="5 5 5"
        position="0 0 0"
        rotation="0 180 0"
        pin-after-delay
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>
  </body>
</html>
