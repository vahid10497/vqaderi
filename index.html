<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>First-Floor Geo + SLAM Anchor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }
    #status {
      position:absolute; top:0; left:0; right:0;
      background:rgba(0,0,0,0.6); color:#fff;
      padding:0.5em; text-align:center; z-index:10;
      pointer-events:none;
    }
    canvas { width:100%; height:100%; display:block; }
  </style>
  <!-- If you have an Origin Trial token for anchors, insert it here: -->
  <!-- <meta http-equiv="origin-trial" content="YOUR_TOKEN_HERE"> -->
</head>
<body>
  <div id="status">🔍 Initializing…</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    // --- YOUR TARGET GEOCOORDINATES + FIRST-FLOOR HEIGHT (in meters) ---
    const TARGET_LAT = 48.28961166630169;
    const TARGET_LON = 14.282566825905297;
    const TARGET_ALT = 4;        // ≈4 m above ground for first floor

    const statusEl = document.getElementById('status');
    const setStatus = txt => statusEl.textContent = txt;

    let scene, camera, renderer;
    let xrRefSpace, xrAnchor = null;
    let userLat, userLon, userAlt, heading;

    // 1) Get GPS
    async function initGeo() {
      return new Promise((res, rej) => {
        if (!navigator.geolocation) return rej('Geolocation unsupported');
        navigator.geolocation.getCurrentPosition(p => {
          userLat = p.coords.latitude;
          userLon = p.coords.longitude;
          userAlt = p.coords.altitude || 0;
          setStatus('📍 GPS ready');
          res();
        }, () => rej('GPS error'));
      });
    }

    // 2) Get absolute device heading
    function initCompass() {
      return new Promise(res => {
        window.addEventListener('deviceorientationabsolute', ev => {
          if (ev.alpha != null) {
            heading = ev.alpha;
            setStatus('🧭 Compass ready');
            res();
          }
        }, { once: true });
      });
    }

    // 3) ENU conversion
    function latLonToENU(lat, lon, lat0, lon0) {
      const R = 6378137;
      const dLat = THREE.MathUtils.degToRad(lat - lat0);
      const dLon = THREE.MathUtils.degToRad(lon - lon0);
      const east  = dLon * R * Math.cos(THREE.MathUtils.degToRad(lat0));
      const north = dLat * R;
      return { east, north };
    }

    // 4) Three.js + ARButton
    function initThree() {
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('xr-canvas'),
        alpha: true, antialias: true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);

      document.body.appendChild(
        ARButton.createButton(renderer, {
          requiredFeatures: ['local-floor','anchors']
        })
      );

      scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));
    }

    // 5) On session start → compute transform + anchor
    function onSessionStart() {
      renderer.xr.getSession()
        .requestReferenceSpace('local-floor')
        .then(refSpace => {
          xrRefSpace = refSpace;
          setStatus('▶️ AR started—anchoring at 1st floor');
          
          // Compute offset ENU from user to target
          const { east, north } = latLonToENU(
            TARGET_LAT, TARGET_LON,
            userLat,   userLon
          );
          const up = TARGET_ALT - userAlt;

          // Build quaternion from compass heading
          const hRad = THREE.MathUtils.degToRad(heading || 0);
          const rot = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(0, -hRad, 0, 'YXZ')
          );

          // Create initial XRRigidTransform
          const initialTransform = new XRRigidTransform(
            { x: east, y: up, z: -north },
            { x: rot.x, y: rot.y, z: rot.z, w: rot.w }
          );

          // Create anchor
          renderer.xr.getFrame().createAnchor(initialTransform, xrRefSpace)
            .then(anchor => {
              xrAnchor = anchor;
              setStatus('✅ Anchor created, locking in 3 s');
              setTimeout(() => setStatus('🔒 Locked at first floor'), 3000);
            })
            .catch(() => setStatus('❌ Anchor failed'));
        });
    }

    // 6) Prepare model (orange sphere)
    let sphere;
    function initModel() {
      sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.3,32,16),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphere.visible = false;
      scene.add(sphere);
    }

    // 7) Render loop
    function renderLoop(time, frame) {
      if (frame && xrAnchor) {
        const ap = frame.getPose(xrAnchor.anchorSpace, xrRefSpace);
        if (ap) {
          sphere.visible = true;
          sphere.matrix.fromArray(ap.transform.matrix);
          sphere.matrix.decompose(
            sphere.position, sphere.quaternion, sphere.scale
          );
          sphere.matrixAutoUpdate = false;
        }
      }
      renderer.render(scene, camera);
    }

    // 8) Entry point
    (async function() {
      try {
        await initGeo();
        await initCompass();
      } catch (e) {
        return setStatus(`❌ ${e}`);
      }
      initThree();
      initModel();

      renderer.xr.addEventListener('sessionstart', onSessionStart);
      renderer.setAnimationLoop(renderLoop);

      setStatus('Tap ENTER AR to place at 1st floor');
    })();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  </script>
</body>
</html>
