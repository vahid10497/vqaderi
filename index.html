<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget (Yellow→Red)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100% }
    a-scene { width:100%; height:100% }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="model"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    // Grab references
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    const modelEl   = document.getElementById('model');
    let pinned = false;

    // Wait for the scene to detect the image
    sceneEl.addEventListener('targetFound', async (e) => {
      // Only for our first target, only once
      if (pinned || e.detail.index !== 0) return;
      pinned = true;

      // 1) Read world-space pose of the tracker entity
      const worldPos  = new AFRAME.THREE.Vector3();
      const worldQuat = new AFRAME.THREE.Quaternion();
      trackerEl.object3D.getWorldPosition(worldPos);
      trackerEl.object3D.getWorldQuaternion(worldQuat);

      // 2) Create a new red box at that pose
      const anchorBox = document.createElement('a-box');
      anchorBox.setAttribute('depth',  '0.5');
      anchorBox.setAttribute('height', '0.5');
      anchorBox.setAttribute('width',  '0.5');
      anchorBox.setAttribute('material','color: red;');

      // Once the element is in the DOM, set its object3D
      anchorBox.addEventListener('loaded', () => {
        anchorBox.object3D.position.copy(worldPos);
        anchorBox.object3D.quaternion.copy(worldQuat);
      });

      // 3) Append to scene root
      sceneEl.appendChild(anchorBox);

      // 4) Hide the original yellow box and its tracker
      modelEl.setAttribute('visible', 'false');
      trackerEl.setAttribute('visible', 'false');

      // 5) Stop the MindAR tracking loop
      await sceneEl.components['mindar-image'].stop();
    });
  </script>
</body>
</html>
