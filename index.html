<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget via Component</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR core & A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Register a 'pinforget' component that will run exactly once, on first detection
    AFRAME.registerComponent('pinforget', {
      init: function () {
        const tracker = this.el;          // the <a-entity mindar-image-target>
        const scene   = this.el.sceneEl;  // the <a-scene mindar-image>
        let pinned = false;

        tracker.addEventListener('targetFound', async () => {
          if (pinned) return;
          pinned = true;

          // 1) Read world-space pose of the tracker entity
          const worldPos  = new THREE.Vector3();
          const worldQuat = new THREE.Quaternion();
          tracker.object3D.getWorldPosition(worldPos);
          tracker.object3D.getWorldQuaternion(worldQuat);

          // 2) Create a brand-new box (or swap to your model) at that pose
          const anchor = document.createElement('a-box');
          anchor.setAttribute('depth',  '0.5');
          anchor.setAttribute('height', '0.5');
          anchor.setAttribute('width',  '0.5');
          anchor.setAttribute('material', 'color: blue;');  // pinned color

          // Immediately set its position + rotation so it's fixed in world-space
          anchor.object3D.position.copy(worldPos);
          anchor.object3D.quaternion.copy(worldQuat);

          // 3) Append it under <a-scene> (outside of the tracker)
          scene.appendChild(anchor);

          // 4) Remove the entire tracker so MindAR can never hide it again
          tracker.parentNode.removeChild(tracker);

          // 5) Pause MindAR’s image-tracking render loop
          await scene.components['mindar-image'].pause();
        });
      }
    });
  </script>

  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
    a-scene     { width:100%; height:100%; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + initial yellow box, plus pinforget -->
    <a-entity mindar-image-target="targetIndex: 0" pinforget>
      <a-box
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>
</body>
</html>
