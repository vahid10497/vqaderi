<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Hybrid AR (GPS + Marker)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      embedded
    >
      <!-- GPS-based model -->
      <a-entity
        id="gps-model"
        gps-entity-place="latitude: 48.29001756836221; longitude: 14.282756650237488;"
        gltf-model="My_model.glb"
        scale="20 20 20"
        position="0 10 0"
        rotation="0 180 0"
      ></a-entity>

      <!-- Marker-based model -->
      <a-marker type="pattern" url="pattern-marker.patt">
        <a-entity
          id="marker-model"
          gltf-model="My_model.glb"
          scale="2 2 2"
          position="0 0 0"
          rotation="0 180 0"
        ></a-entity>
      </a-marker>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const gpsModel = document.getElementById("gps-model");
      const marker = document.querySelector("a-marker");

      marker.addEventListener("markerFound", () => {
        gpsModel.setAttribute("visible", false);
      });

      marker.addEventListener("markerLost", () => {
        gpsModel.setAttribute("visible", true);
      });
    </script>
  </body>
</html>
