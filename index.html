<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GeoAR with Fixed Position</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <!-- Sphere with GPS position -->
      <a-sphere
        id="targetSphere"
        radius="5"
        color="red"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 15 0"
      ></a-sphere>

      <!-- Confirmation Text -->
      <a-text
        id="statusText"
        value="Searching for rooftop..."
        position="0 2 -5"
        look-at="[gps-camera]"
        scale="10 10 10"
        visible="true"
      ></a-text>

      <!-- Camera -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const sphere = document.getElementById('targetSphere');
      const statusText = document.getElementById('statusText');

      sphere.addEventListener('gps-entity-place-added', () => {
        statusText.setAttribute('value', 'Model found! Fixing in 5s...');
        // Wait 5 seconds before locking
        setTimeout(() => {
          // Get world position
          const worldPos = new THREE.Vector3();
          sphere.object3D.getWorldPosition(worldPos);

          // Remove GPS tracking
          sphere.removeAttribute('gps-entity-place');

          // Lock position permanently
          sphere.setAttribute('position', {
            x: worldPos.x,
            y: worldPos.y,
            z: worldPos.z,
          });

          statusText.setAttribute('value', 'Fixed!');
          console.log('Position fixed at:', worldPos);
        }, 5000);
      });
    </script>
  </body>
</html>
