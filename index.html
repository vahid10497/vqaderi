<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js NFT Pin & Forget (Lime Box)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js with NFT support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
      a-scene { width:100%; height:100%; position:absolute; top:0; left:0; }
    </style>
  </head>
  <body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- NFT marker entity -->
      <a-nft
        id="nftMarker"
        type="nft"
        url="./marker"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
        emitevents="true"
      >
        <!-- Lime-green box as your pinned content -->
        <a-box id="pinBox" color="lime" depth="0.2" height="0.2" width="0.2" position="0 0.1 0"></a-box>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const nftEl = document.getElementById('nftMarker');
      nftEl.addEventListener('markerFound', () => {
        // Freeze the NFT entity in place
        nftEl.setAttribute('nft', {
          url: nftEl.getAttribute('url'),
          positionFixed: true
        });
        console.log('🔒 NFT positionFixed — box will stay lime-green and pinned');
      });
    </script>
  </body>
</html>
