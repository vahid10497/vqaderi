<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebXR Image-Tracking → Auto-Place Fallback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif }
    #message {
      position:absolute; top:10px; width:100%; text-align:center;
      background:rgba(0,0,0,0.6); color:#fff; padding:0.5em; z-index:1;
    }
    #xr-canvas { width:100%; height:100%; display:block }
  </style>
</head>
<body>
  <div id="message">Initializing AR…</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    let scene, camera, renderer, sphere, xrRefSpace;
    let useImageTracking = false;

    init();
    async function init() {
      const msg = document.getElementById('message');
      if (!navigator.xr) {
        msg.textContent = '❌ WebXR not available';
        return;
      }
      if (!(await navigator.xr.isSessionSupported('immersive-ar'))) {
        msg.textContent = '❌ AR not supported';
        return;
      }

      // Do we have image-tracking?
      try {
        useImageTracking = await navigator.xr.isSessionSupported('immersive-ar', {
          requiredFeatures: ['image-tracking']
        });
      } catch {
        useImageTracking = false;
      }

      // Load marker only if supported
      let trackedImages;
      if (useImageTracking) {
        msg.textContent = '🔍 Loading marker…';
        const markerImg = new Image();
        markerImg.src = './marker.png';
        try {
          await markerImg.decode();
        } catch {
          console.error('marker.png load failed');
          trackedImages = null;
          useImageTracking = false;
        }
        if (useImageTracking) {
          trackedImages = [{ image: markerImg, widthInMeters: 0.2 }];
        }
      }

      // Three.js setup
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('xr-canvas'), alpha: true });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Make sure we always request at least local-floor so the button shows
      const features = ['local-floor'];
      if (useImageTracking) features.push('image-tracking');

      const buttonOpts = { requiredFeatures: features };
      if (useImageTracking) buttonOpts.trackedImages = trackedImages;

      document.body.appendChild( ARButton.createButton(renderer, buttonOpts) );

      // Light & sphere
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
      sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 32, 16),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphere.visible = false;
      scene.add(sphere);

      // On session start
      renderer.xr.addEventListener('sessionstart', async () => {
        msg.textContent = useImageTracking
          ? '▶️ Point at marker.png'
          : '▶️ Tap to place sphere';
        if (useImageTracking) {
          xrRefSpace = await renderer.xr.getSession().requestReferenceSpace('local-floor');
        } else {
          // auto-place immediately
          placeAuto();
        }
      });

      renderer.setAnimationLoop(render);
    }

    function placeAuto() {
      const cam = renderer.xr.getCamera(camera);
      const dir = new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
      const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
      sphere.position.copy(pos);
      sphere.quaternion.copy(cam.quaternion);
      sphere.visible = true;
      document.getElementById('message').textContent = '✅ Sphere placed';
    }

    function render(time, frame) {
      if (!frame) {
        renderer.render(scene, camera);
        return;
      }

      if (useImageTracking) {
        const results = frame.getImageTrackingResults();
        for (const result of results) {
          if (result.trackingState === 'tracked') {
            const pose = frame.getPose(result.imageSpace, xrRefSpace);
            if (pose) {
              sphere.visible = true;
              sphere.matrix.fromArray(pose.transform.matrix);
              sphere.matrix.decompose(sphere.position, sphere.quaternion, sphere.scale);
              sphere.matrixAutoUpdate = false;
              document.getElementById('message').textContent = '✅ Marker tracked';
            }
          }
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
