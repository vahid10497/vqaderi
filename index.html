<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Debug Pin & Forget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body,html {margin:0;padding:0;overflow:hidden;width:100%;height:100}
    a-scene{width:100%;height:100}
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera></a-camera>

    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box id="liveBox" position="0 0.5 0" material="color: brown;"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    const liveBox   = document.getElementById('liveBox');
    let pinned = false;

    trackerEl.addEventListener('targetFound', () => {
      console.log('🔵 targetFound fired');
      if (pinned) {
        console.log('⚠️ already pinned, skipping');
        return;
      }
      pinned = true;

      // 1) turn brown → green
      liveBox.setAttribute('material','color: green;');

      // 2) grab world-space position of liveBox
      const pos = new THREE.Vector3();
      liveBox.object3D.getWorldPosition(pos);
      console.log('📐 liveBox world position:', pos);

      // 3) create a blue box and append
      const blueBox = document.createElement('a-box');
      console.log('✂️ Creating blueBox element:', blueBox);
      blueBox.setAttribute('material','color: blue;');
      // place it at pos + (0.5, 0, 0)
      blueBox.setAttribute('position',
        `${(pos.x + 0.5).toFixed(3)} ${pos.y.toFixed(3)} ${pos.z.toFixed(3)}`
      );
      console.log('🎯 Setting blueBox position to', blueBox.getAttribute('position'));

      sceneEl.appendChild(blueBox);
      console.log('➕ blueBox appended to sceneEl:', blueBox);

      // STOP HERE — do NOT remove tracker or pause yet
      console.log('✅ Blue box should now be visible (even if unrotated)');
    });
  </script>
</body>
</html>
