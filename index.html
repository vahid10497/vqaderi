<a-nft
  type="nft" url="./Marker"
  smooth="true" emitevents="true"
>
  <!-- This box follows the marker -->
  <a-box id="liveBox" position="0 0.3 0" material="color:yellow;"></a-box>
</a-nft>

<script>
  const scene = document.querySelector('a-scene');
  const liveBox = document.getElementById('liveBox');
  const nft = document.querySelector('a-nft');

  nft.addEventListener('markerFound', () => {
    // 1) Get its world matrix
    const m = liveBox.object3D.matrixWorld.clone();
    const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
    m.decompose(pos, quat, scl);

    // 2) Reparent out to scene root
    scene.appendChild(liveBox);

    // 3) Reapply pose
    const euler = new THREE.Euler().setFromQuaternion(quat, 'XYZ');
    liveBox.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
    liveBox.setAttribute('rotation',
      `${THREE.MathUtils.radToDeg(euler.x)} ` +
      `${THREE.MathUtils.radToDeg(euler.y)} ` +
      `${THREE.MathUtils.radToDeg(euler.z)}`
    );

    // 4) Remove the NFT tracker so it can no longer hide your box
    nft.parentNode.removeChild(nft);
  });
</script>
