<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindARThree Pin & Forget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>body { margin:0; overflow:hidden; }</style>
</head>
<body>
  <button id="start">Start AR</button>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';
    import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

    const startButton = document.getElementById('start');
    startButton.addEventListener('click', async () => {
      startButton.style.display = 'none';

      // 1) Init MindARThree
      const mindar = new MindARThree({
        container: document.body,
        imageTargetSrc: './targets.mind',
        maxTrack: 1
      });
      const { renderer, scene, camera } = mindar;

      // 2) Light
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // 3) ARButton
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local-floor'] }));
      renderer.xr.enabled = true;

      // 4) Anchor group for your image target
      const anchor = mindar.addAnchor(0);

      // 5) A small yellow box that follows the marker
      const liveGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const liveMat = new THREE.MeshStandardMaterial({ color: 'yellow' });
      const liveBox = new THREE.Mesh(liveGeo, liveMat);
      liveBox.position.set(0, 0.1, 0);
      anchor.group.add(liveBox);

      // 6) On first detection, clone & detach at exactly that world pose
      let pinned = false;
      anchor.onTargetFound = () => {
        if (pinned) return;
        pinned = true;

        // Clone the box (or you could load any GLTF here instead)
        const pinnedBox = new THREE.Mesh(liveGeo, new THREE.MeshStandardMaterial({ color: 'red' }));
        // Copy world matrix
        pinnedBox.applyMatrix4(anchor.group.matrixWorld);
        pinnedBox.matrixAutoUpdate = false;       // freeze it
        scene.add(pinnedBox);                     // now it’s independent

        // Optional: remove live box after a delay
        setTimeout(() => {
          anchor.group.remove(liveBox);
          mindar.stop();                          // stops tracking but leaves your pinnedBox
        }, 3000);
      };

      // 7) Start AR loop
      await mindar.start();
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    });
  </script>
</body>
</html>
