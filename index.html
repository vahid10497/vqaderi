
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stable GPS AR with Position Fixed - Y=20m</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <!-- Main Sphere - Your rooftop object -->
      <a-sphere
        id="mainSphere"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 20 0"
        radius="4"
        color="#0077FF"
        look-at="[gps-camera]"
        scale="1 1 1"
      ></a-sphere>

      <!-- Debug small red sphere at exact GPS anchor -->
      <a-sphere
        position="0 20 0"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        radius="0.5"
        color="#FF0000"
      ></a-sphere>

      <!-- Status Text -->
      <a-text
        id="statusText"
        value="Waiting for GPS fix..."
        position="0 25 0"
        scale="8 8 8"
        color="#FFFFFF"
        look-at="[gps-camera]"
      ></a-text>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      window.onload = () => {
        const sphere = document.getElementById('mainSphere');
        const statusText = document.getElementById('statusText');

        // Wait 5 seconds, then fix position so it stops jittering
        setTimeout(() => {
          sphere.setAttribute('position-fixed', 'true');
          statusText.setAttribute('value', 'Object position fixed!');
        }, 5000);
      };
    </script>
  </body>
</html>
