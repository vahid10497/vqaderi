<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Geo AR — Two-Step Flow</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }
    #status {
      position:absolute; top:0; left:0; right:0;
      background:rgba(0,0,0,0.6); color:#fff;
      padding:0.5em; text-align:center; z-index:10;
    }
    #buttons {
      position:absolute; bottom:20px; left:0; right:0;
      display:flex; justify-content:center; gap:1em;
      z-index:10;
    }
    button {
      font-size:1rem; padding:0.75em 1.5em;
      border:none; border-radius:4px;
      background:#28a; color:white;
    }
    canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <div id="status">→ step 1: get location</div>
  <div id="buttons">
    <button id="btn-getpos">Get Position</button>
  </div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    // your target coords
    const TARGET_LAT = 48.305596;
    const TARGET_LON = 14.289124;
    const MODEL_H   = 3.0;
    const EYE_H     = 1.6;

    const statusEl  = document.getElementById('status');
    const buttonsEl = document.getElementById('buttons');
    let userLat, userLon, heading;

    let scene, camera, renderer;
    let geoSphere, fallbackSphere;
    let xrRefSpace=null, xrAnchor=null, anchored=false, tries=0;

    function setStatus(t){ statusEl.textContent = t; console.log(t); }

    // step 1: sample GPS + compass
    async function getPositionAndHeading(){
      setStatus('📍 Asking GPS…');
      const { coords } = await new Promise((res, rej)=>
        navigator.geolocation.getCurrentPosition(res, rej, {
          enableHighAccuracy:true, timeout:7000
        })
      );
      userLat = coords.latitude;
      userLon = coords.longitude;
      setStatus(`📍 GPS: ${userLat.toFixed(6)},${userLon.toFixed(6)}`);

      heading = await new Promise(res=>{
        window.addEventListener('deviceorientationabsolute', e=>{
          if(e.alpha!=null) res(e.alpha);
        }, { once:true });
      });
      setStatus(`🧭 Heading: ${heading.toFixed(1)}°`);
    }

    // ENU math
    function latLonToENU(lat, lon, lat0, lon0){
      const R=6378137;
      const dLat=THREE.MathUtils.degToRad(lat-lat0);
      const dLon=THREE.MathUtils.degToRad(lon-lon0);
      return {
        east:  dLon*R*Math.cos(THREE.MathUtils.degToRad(lat0)),
        north: dLat*R
      };
    }

    // init Three + ARButton
    function initThree(){
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas:document.getElementById('xr-canvas'),
        alpha:true, antialias:true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);

      // put ARButton after step 1 so we can style it alone
      const arBtn = ARButton.createButton(renderer,{
        requiredFeatures:['local-floor','anchors']
      });
      arBtn.style.position='absolute';
      arBtn.style.bottom='20px';
      arBtn.style.left='50%';
      arBtn.style.transform='translateX(-50%)';
      arBtn.style.zIndex='20';
      document.body.appendChild(arBtn);

      scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));
    }

    // big spheres
    function initModels(){
      geoSphere = new THREE.Mesh(
        new THREE.SphereGeometry(5,32,16),
        new THREE.MeshStandardMaterial({ color:0xff6600 })
      );
      geoSphere.visible=false; scene.add(geoSphere);

      fallbackSphere = geoSphere.clone();
      fallbackSphere.material = new THREE.MeshStandardMaterial({ color:0x00ff00 });
      fallbackSphere.visible=false; scene.add(fallbackSphere);
    }

    // per-frame
    async function onXRFrame(time, frame){
      const session = frame.session;
      if(!xrRefSpace){
        try{
          xrRefSpace = await session.requestReferenceSpace('local-floor');
          console.log('got local-floor');
        }catch(e){ console.warn(e); }
      }

      // place once
      if(!anchored && tries++<5 && xrRefSpace){
        setStatus('⌛ placing…');
        // compute ENU
        const { east, north } = latLonToENU(
          TARGET_LAT, TARGET_LON,
          userLat, userLon
        );
        console.log('ENU',east,north);

        // orientation
        const rot = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(0, -THREE.MathUtils.degToRad(heading||0),0,'YXZ')
        );

        // sphere pos
        const pos = {
          x: east,
          y: MODEL_H - EYE_H,
          z: -north
        };
        console.log('place at',pos);

        try {
          xrAnchor = await frame.createAnchor(
            new XRRigidTransform(pos,rot), xrRefSpace
          );
          setStatus('✅ Anchor created');
          geoSphere.visible = true;
        }catch(e){
          console.warn(e);
          setStatus('⚠️ fallback');
          const cam = renderer.xr.getCamera(camera);
          const dir = new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
          fallbackSphere.position.copy(cam.position.clone().add(dir.multiplyScalar(2)));
          fallbackSphere.quaternion.copy(cam.quaternion);
          fallbackSphere.visible=true;
        }
        anchored = true;
      }

      // update
      if(xrAnchor){
        const p = frame.getPose(xrAnchor.anchorSpace, xrRefSpace);
        if(p){
          geoSphere.matrix.fromArray(p.transform.matrix);
          geoSphere.matrix.decompose(
            geoSphere.position,
            geoSphere.quaternion,
            geoSphere.scale
          );
          geoSphere.matrixAutoUpdate=false;
        }
      }

      renderer.render(scene, camera);
    }

    // main
    document.getElementById('btn-getpos').onclick = async ()=>{
      buttonsEl.innerHTML = '';    // remove button
      try{
        await getPositionAndHeading();
      }catch(e){
        return setStatus('❌ GPS/compass failed');
      }
      setStatus('→ step 2: ENTER AR');
      initThree();
      initModels();
      renderer.xr.setAnimationLoop(onXRFrame);
    };

    window.addEventListener('resize',()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  </script>
</body>
</html>
