<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MindAR.js Full-Screen Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR core & A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* Make sure nothing in the page constrains the scene */
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Removed `embedded` so it fills the whole window -->
    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      debugUIEnabled="false"
    >
      <a-assets>
        <img id="cardImage" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" />
        <a-asset-item id="avatarModel"
          src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf">
        </a-asset-item>
      </a-assets>

      <!-- camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- tracker -->
      <a-entity id="tracker" mindar-image-target="targetIndex: 0">
        <a-plane src="#cardImage" position="0 0 0" height="0.552" width="1"></a-plane>
        <a-gltf-model id="liveModel"
          src="#avatarModel"
          position="0 0 0.1"
          scale="0.005 0.005 0.005"
          animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
