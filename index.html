<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebXR GPS-Anchored Sphere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; overflow:hidden; }
    #xr-canvas { width:100%; height:100%; display:block; }
    #message {
      position: absolute; top: 0; width:100%; padding:1em;
      background:rgba(0,0,0,0.6); color:white; font-family:sans-serif;
      text-align:center; z-index:1;
    }
  </style>
</head>
<body>
  <div id="message">Initializing AR…</div>
  <canvas id="xr-canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;

    // your building’s GPS
    const buildLat = 48.29002038491218;
    const buildLon = 14.282757518735202;
    const floorOffsetM = 3; // meters above user altitude

    init();
    async function init() {
      if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar'))) {
        document.getElementById('message').textContent =
          'AR not supported on this device/browser.';
        return;
      }

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('xr-canvas'),
        alpha: true,
        antialias: true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);

      document.body.appendChild(
        ARButton.createButton(renderer, { requiredFeatures: ['local-floor'] })
      );

      renderer.xr.addEventListener('sessionstart', placeSphere);

      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    }

    function placeSphere() {
      document.getElementById('message').style.display = 'none';

      navigator.geolocation.getCurrentPosition((pos) => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;
        const userAlt = pos.coords.altitude || 0;

        // compute meters-per-degree
        const toRad = d => d * Math.PI / 180;
        const latRad = toRad(userLat);
        const mPerLat = 111132.92;
        const mPerLon = 111412.84 * Math.cos(latRad);

        // ENU offset
        const dx = (buildLon - userLon) * mPerLon;  // east
        const dz = (buildLat - userLat) * mPerLat;  // north
        const dy = floorOffsetM - userAlt;          // up

        // create sphere
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.3, 32, 32),
          new THREE.MeshStandardMaterial({ color: 0xff6600 })
        );

        // place at (dx, dy, -dz) in world-space
        sphere.position.set(dx, dy, -dz);

        // orient same as camera (optional)
        const cam = renderer.xr.getCamera(camera);
        sphere.quaternion.copy(cam.quaternion);

        scene.add(sphere);
      }, (err) => {
        console.error('GPS error', err);
        document.getElementById('message').textContent =
          'Could not get GPS position.';
      });
    }
  </script>
</body>
</html>
