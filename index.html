<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget (Reparent)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>body,html{margin:0;padding:0;overflow:hidden;width:100%;height:100;}a-scene{width:100%;height:100}</style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + yellow box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="model"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl   = document.getElementById('scene');
    const trackerEl = document.getElementById('tracker');
    const modelEl   = document.getElementById('model');
    let pinned = false;

    // Listen on the scene for first detection
    sceneEl.addEventListener('targetFound', async (e) => {
      if (pinned || e.detail.index !== 0) return;
      pinned = true;

      // 1) Capture world-space transform of the yellow box
      const worldPos  = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();
      modelEl.object3D.getWorldPosition(worldPos);
      modelEl.object3D.getWorldQuaternion(worldQuat);

      // 2) Reparent the box under <a-scene>
      sceneEl.appendChild(modelEl);

      // 3) Apply the captured pose to its attributes
      //    Convert quaternion to Euler degrees:
      const euler = new THREE.Euler().setFromQuaternion(worldQuat);
      modelEl.setAttribute('position',
        `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
      );
      modelEl.setAttribute('rotation',
        `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)} ` +
        `${THREE.MathUtils.radToDeg(euler.y).toFixed(1)} ` +
        `${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`
      );
      // Turn it red so you know it's pinned
      modelEl.setAttribute('material', 'color: red;');

      // 4) Remove the now-empty tracker entity
      trackerEl.parentNode.removeChild(trackerEl);

      // 5) Pause MindAR's image-tracker so it stops clearing the view
      await sceneEl.components['mindar-image'].pause();
    });
  </script>
</body>
</html>
