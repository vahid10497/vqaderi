<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hybrid GPS + WebXR AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
      model-viewer {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        z-index: 999;
      }
    </style>
  </head>

  <body>
    <!-- AR.js Scene with GPS Placement -->
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      embedded
      renderer="logarithmicDepthBuffer: true;"
    >
      <a-entity
        id="gps-model"
        gltf-model="My_model.glb"
        gps-entity-place="latitude: 48.29001756836221; longitude: 14.282756650237488;"
        scale="5 5 5"
        rotation="0 180 0"
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <!-- WebXR Placement after 20s -->
    <model-viewer
      id="webxrModel"
      src="My_model.glb"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      alt="AR Model"
    ></model-viewer>

    <script>
      setTimeout(() => {
        // Hide AR.js and show WebXR model
        document.querySelector("a-scene").style.display = "none";
        const modelViewer = document.getElementById("webxrModel");
        modelViewer.style.display = "block";
        modelViewer.activateAR();
      }, 20000); // 20 seconds
    </script>
  </body>
</html>
