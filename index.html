<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MindAR Pin & Forget Full-Screen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 1) A-Frame core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- 2) MindAR core -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <!-- 3) MindAR A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
      }
      a-scene {
        width: 100% !important; height: 100% !important;
        position: absolute; top: 0; left: 0;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      debugUIEnabled="false"
    >
      <!-- Full-screen AR camera -->
      <a-camera look-controls="enabled: false"></a-camera>

      <!-- Tracker entity containing your content -->
      <a-entity id="tracker" mindar-image-target="targetIndex: 0">
        <!-- Replace this with your GLTF or other entity -->
        <a-box id="trackerContent" position="0 0.5 0" color="orange"></a-box>
      </a-entity>
    </a-scene>

    <script>
      (function() {
        const sceneEl   = document.querySelector('a-scene');
        const trackerEl = document.getElementById('tracker');
        const contentEl = document.getElementById('trackerContent');
        let pinnedEl;

        trackerEl.addEventListener('targetFound', async () => {
          if (pinnedEl) return;  // only pin once

          // 1) Capture world transform of the tracker
          const worldMatrix = trackerEl.object3D.matrixWorld.clone();

          // 2) Create a new entity and clone your content into it
          pinnedEl = document.createElement('a-entity');
          const clone = contentEl.cloneNode(true);
          pinnedEl.appendChild(clone);

          // 3) Apply the world transform to the new entity
          pinnedEl.object3D.matrix.copy(worldMatrix);
          pinnedEl.object3D.matrix.decompose(
            pinnedEl.object3D.position,
            pinnedEl.object3D.quaternion,
            pinnedEl.object3D.scale
          );

          // 4) Add it to the scene root
          sceneEl.appendChild(pinnedEl);

          // 5) Hide the original tracker so it never toggles visibility
          trackerEl.setAttribute('visible', 'false');

          // 6) Stop MindAR image tracking entirely
          await sceneEl.components['mindar-image'].stop();

          console.log('▶️ Content pinned and MindAR stopped.');
        });
      })();
    </script>
  </body>
</html>
