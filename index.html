<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stable AR.js Rooftop Sphere</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Vertical anchor cylinder from ground to rooftop -->
      <a-cylinder
        color="#00FF00"
        radius="0.2"
        height="15"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 7.5 0"
        opacity="0.6"
      ></a-cylinder>

      <!-- Bigger red sphere on rooftop -->
      <a-sphere
        id="rooftopSphere"
        color="red"
        radius="2.5"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 15 0"
      ></a-sphere>

      <!-- Label just above the sphere -->
      <a-text
        value="On the rooftop!"
        color="white"
        scale="15 15 15"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 18 0"
      ></a-text>

      <!-- Show your simulated GPS location for debug -->
      <a-entity
        id="debugText"
        position="0 0 -3"
        text="value: Waiting for GPS...; color: yellow; width: 6;"
      ></a-entity>

      <!-- Camera with minDistance to filter small GPS moves -->
      <a-camera
        gps-camera="simulateLatitude: 48.29001756836221; simulateLongitude: 14.282756650237488; minDistance: 5"
        rotation-reader
      ></a-camera>

      <script>
        // Simple moving average filter for smoothing GPS positions
        const smoothingWindowSize = 5;
        const gpsPositions = [];

        function averagePosition(positions) {
          const sum = positions.reduce(
            (acc, pos) => {
              return {
                latitude: acc.latitude + pos.latitude,
                longitude: acc.longitude + pos.longitude,
              };
            },
            { latitude: 0, longitude: 0 }
          );
          return {
            latitude: sum.latitude / positions.length,
            longitude: sum.longitude / positions.length,
          };
        }

        // Update GPS debug text and smooth GPS coordinates before applying
        window.addEventListener("gps-camera-update-position", (e) => {
          // Add new position
          gpsPositions.push(e.detail.position);
          if (gpsPositions.length > smoothingWindowSize) {
            gpsPositions.shift(); // Keep window size
          }

          // Compute average position
          const avgPos = averagePosition(gpsPositions);

          // Update debug text with smoothed values
          document
            .getElementById("debugText")
            .setAttribute(
              "text",
              "value",
              `You are at:\n${avgPos.latitude.toFixed(6)}, ${avgPos.longitude.toFixed(6)}`
            );

          // Optionally, you can feed smoothed GPS back to camera or entities if needed
          // (AR.js doesn't allow easy override of gps-camera position, so we mainly smooth debug info here)
        });

        // Lock the rooftop sphere & anchors after first placement to stop jitter
        let locked = false;
        window.addEventListener("gps-entity-place-added", (e) => {
          if (locked) return; // only once

          const el = e.detail.el;

          // Apply positionFixed to lock in place (reduce jitter)
          el.setAttribute("gps-entity-place", {
            latitude: el.getAttribute("gps-entity-place").latitude,
            longitude: el.getAttribute("gps-entity-place").longitude,
            positionFixed: true,
          });

          locked = true;
          console.log("Entity locked in place to reduce jitter.");
        });
      </script>
    </a-scene>
  </body>
</html>
