<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GeoAR Pinning Example</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <!-- GPS-tracked entity -->
      <a-entity
        id="gps-model"
        gps-entity-place="latitude: 48.29001756836221; longitude: 14.282756650237488;"
        gltf-model="My_model.glb"
        scale="5 5 5"
        rotation="0 180 0"
      ></a-entity>

      <!-- AR camera -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      setTimeout(() => {
        const gpsModel = document.getElementById('gps-model');

        // Get the current world position
        const worldPos = new THREE.Vector3();
        gpsModel.object3D.getWorldPosition(worldPos);

        // Remove GPS tracking
        gpsModel.removeAttribute('gps-entity-place');

        // Convert world position to local (scene) coordinates
        const scene = document.querySelector('a-scene');
        const scenePos = scene.object3D.worldToLocal(worldPos);

        // Apply fixed position
        gpsModel.setAttribute('position', `${scenePos.x} ${scenePos.y} ${scenePos.z}`);

        console.log('📍 Model pinned at position:', scenePos);
      }, 20000); // 20 seconds
    </script>
  </body>
</html>
