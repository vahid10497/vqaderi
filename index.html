<!doctype html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js + Model Viewer GPS Anchor</title>
    <style>
      body { margin: 0; overflow: hidden; }
      #mv-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
      model-viewer { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <a-scene embedded arjs="sourceType: webcam; gpsMinAccuracy: 100; debugUIEnabled: false">
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <div id="mv-container">
      <model-viewer
        id="model"
        ar
        ar-modes="webxr scene-viewer quick-look"
        scale="1 1 1"
        src="model.glb"
        camera-controls
        auto-rotate
        exposure="1"
        shadow-intensity="1">
      </model-viewer>
    </div>

    <script>
      const targetLat = 48.28994506928232;
      const targetLon = 14.282882682071433;

      navigator.geolocation.getCurrentPosition(pos => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;

        const offset = gpsToOffset(userLat, userLon, targetLat, targetLon);
        const model = document.getElementById('model');
        model.style.transform = `translate3d(${offset.x}px, 0, ${offset.z}px)`;
      }, err => {
        console.warn('❌ GPS error: ' + err.message);
      }, { enableHighAccuracy: true });

      function gpsToOffset(userLat, userLon, targetLat, targetLon) {
        const R = 6371000;
        const dLat = (targetLat - userLat) * Math.PI / 180;
        const dLon = (targetLon - userLon) * Math.PI / 180;
        const lat1 = userLat * Math.PI / 180;
        const lat2 = targetLat * Math.PI / 180;

        const a = Math.sin(dLat/2)**2 + Math.sin(dLon/2)**2 * Math.cos(lat1) * Math.cos(lat2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const distance = R * c;

        const bearing = Math.atan2(
          Math.sin(dLon) * Math.cos(lat2),
          Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon)
        );

        return {
          x: distance * Math.sin(bearing),
          z: distance * Math.cos(bearing)
        };
      }
    </script>
  </body>
</html>
