<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>WebXR Image-Tracking Pin & Forget</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }
    #start {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      padding:1em 2em; font-size:1.2em;
      background:#28a; color:#fff; border:none; border-radius:4px;
      z-index:2;
    }
    #message {
      position:absolute; top:10px; width:100%; text-align:center;
      color:#fff; background:rgba(0,0,0,0.6); padding:0.5em;
      z-index:2;
    }
    #xr-canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <button id="start">Start AR</button>
  <div id="message">🔍 Waiting to start AR…</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';

    const startButton = document.getElementById('start');
    const message     = document.getElementById('message');
    const canvas      = document.getElementById('xr-canvas');
    let renderer, scene, camera, sphere, xrRefSpace, pinned = false;

    startButton.addEventListener('click', async () => {
      startButton.style.display = 'none';
      message.textContent = '🚀 Initializing AR…';

      if ( !navigator.xr ) {
        message.textContent = '❌ WebXR not available';
        return;
      }
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        message.textContent = '❌ AR not supported';
        return;
      }

      // Load marker image
      const markerImg = new Image();
      markerImg.src = './marker.png';
      await markerImg.decode();

      // Three.js setup
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;

      // Light
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // Sphere (initially hidden)
      sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 32, 16),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphere.visible = false;
      scene.add(sphere);

      // Request AR session with image-tracking
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local-floor','image-tracking'],
        trackedImages:    [{ image: markerImg, widthInMeters: 0.2 }]
      });
      renderer.xr.setSession(session);

      xrRefSpace = await session.requestReferenceSpace('local-floor');
      message.textContent = '🔍 Point at marker.png';

      // Render loop
      renderer.setAnimationLoop((time, frame) => {
        if (frame) {
          const results = frame.getImageTrackingResults();
          for (const result of results) {
            if (result.trackingState === 'tracked') {
              // show and pin sphere
              sphere.visible = true;
              message.textContent = '✅ Marker tracked — sphere pinned';

              const pose = frame.getPose(result.imageSpace, xrRefSpace);
              if (pose) {
                sphere.matrix.fromArray(pose.transform.matrix);
                sphere.matrix.decompose(sphere.position, sphere.quaternion, sphere.scale);
                sphere.matrixAutoUpdate = false;
                pinned = true;
              }
            }
          }
          // once pinned, we no longer update its matrix,
          // so it stays at the last tracked location
        }
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
