<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Geo AR — Orange Sphere Only</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif }
    #status {
      position:absolute; top:0; left:0; right:0;
      background:rgba(0,0,0,0.6); color:#fff;
      padding:0.5em; text-align:center; z-index:10;
      pointer-events:none;
    }
    canvas { width:100%; height:100%; display:block }
  </style>
</head>
<body>
  <div id="status">🔍 Ready…</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    // — YOUR TARGET COORDS —
    const TARGET_LAT = 48.305596;
    const TARGET_LON = 14.289124;
    const MODEL_H    = 3.0;
    const EYE_H      = 1.6;

    const statusEl = document.getElementById('status');
    const setStatus = msg => statusEl.textContent = msg;

    let scene, camera, renderer;
    let sphereMesh;
    let xrRefSpace = null, xrAnchor = null;

    // Sample GPS + compass
    async function sampleSensors() {
      setStatus('📍 Getting GPS…');
      const { coords } = await new Promise((res, rej)=>
        navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy:true, timeout:5000 })
      );
      setStatus(`📍 GPS: ${coords.latitude.toFixed(6)},${coords.longitude.toFixed(6)}`);

      const heading = await new Promise(res=>{
        window.addEventListener('deviceorientationabsolute', ev=>{
          if(ev.alpha!=null) res(ev.alpha);
        }, { once:true });
      });
      setStatus(`🧭 Heading: ${heading.toFixed(1)}°`);
      return { lat: coords.latitude, lon: coords.longitude, heading };
    }

    function latLonToENU(lat, lon, lat0, lon0) {
      const R = 6378137;
      const dLat = THREE.MathUtils.degToRad(lat - lat0);
      const dLon = THREE.MathUtils.degToRad(lon - lon0);
      return {
        east:  dLon * R * Math.cos(THREE.MathUtils.degToRad(lat0)),
        north: dLat * R
      };
    }

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('xr-canvas'),
        alpha:true, antialias:true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);

      // ARButton wrapped to catch overlay‐blocking error
      const btn = ARButton.createButton(renderer, {
        requiredFeatures: ['local-floor','anchors']
      });
      btn.style.zIndex = 9999;
      btn.addEventListener('click', async () => {
        setStatus('▶️ Starting AR…');
        try {
          await navigator.xr.requestSession; // trigger permission prompt
        } catch(e) {
          setStatus('❌ Permission blocked: close overlays and retry');
        }
      });
      document.body.appendChild(btn);

      scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));
    }

    function initModel() {
      // 2.5 m radius sphere
      sphereMesh = new THREE.Mesh(
        new THREE.SphereGeometry(2.5, 32, 16),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphereMesh.visible = false;
      scene.add(sphereMesh);
    }

    async function onXRFrame(_, frame) {
      const session = frame.session;

      // get refSpace once
      if (!xrRefSpace) {
        try {
          xrRefSpace = await session.requestReferenceSpace('local-floor');
        } catch (e) {
          console.warn(e);
          return;
        }
      }

      // once only: sample sensors + place anchor
      if (!xrAnchor) {
        let lat, lon, heading;
        try {
          ({ lat, lon, heading } = await sampleSensors());
          setTimeout(() => setStatus('⌛ Positioning…'), 500);
        } catch (e) {
          console.warn(e);
        }

        const { east, north } = latLonToENU(TARGET_LAT, TARGET_LON, lat, lon);
        const rot = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(0, -THREE.MathUtils.degToRad(heading||0), 0, 'YXZ')
        );
        const pos = { x: east, y: MODEL_H - EYE_H, z: -north };

        try {
          xrAnchor = await frame.createAnchor(
            new XRRigidTransform(pos, rot),
            xrRefSpace
          );
          setStatus('✅ Anchored');
          sphereMesh.visible = true;
        } catch (_) {
          console.warn('anchor failed', _);
          setStatus('⚠️ Anchor failed');
        }
      }

      // update pose
      if (xrAnchor) {
        const pose = frame.getPose(xrAnchor.anchorSpace, xrRefSpace);
        if (pose) {
          sphereMesh.matrix.fromArray(pose.transform.matrix);
          sphereMesh.matrix.decompose(
            sphereMesh.position,
            sphereMesh.quaternion,
            sphereMesh.scale
          );
          sphereMesh.matrixAutoUpdate = false;
        }
      }

      renderer.render(scene, camera);
    }

    (async () => {
      initThree();
      initModel();
      renderer.xr.setAnimationLoop(onXRFrame);
      setStatus('Tap ENTER AR');
    })();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
