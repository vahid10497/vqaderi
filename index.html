<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Rooftop Test</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Debug Red Sphere on Roof -->
      <a-sphere
        color="red"
        radius="1"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 10 0"
      ></a-sphere>

      <!-- Text on Roof -->
      <a-text
        value="Hello from the roof!"
        scale="15 15 15"
        gps-entity-place="latitude: 48.28961166630169; longitude: 14.282566825905297;"
        position="0 12 0"
      ></a-text>

      <!-- Show current GPS as text in front of camera -->
      <a-entity
        id="debugText"
        position="0 0 -3"
        text="value: Waiting for GPS...; color: white; width: 6;"
      ></a-entity>

      <!-- Simulate your location -->
      <a-camera
        gps-camera="simulateLatitude: 48.29001756836221; simulateLongitude: 14.282756650237488;"
        rotation-reader
      ></a-camera>

      <script>
        window.addEventListener("gps-camera-update-position", (e) => {
          const lat = e.detail.position.latitude.toFixed(6);
          const lon = e.detail.position.longitude.toFixed(6);
          document
            .getElementById("debugText")
            .setAttribute("text", "value", `You are at:\n${lat}, ${lon}`);
        });
      </script>
    </a-scene>
  </body>
</html>
