<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>WebXR Image-Tracking Pin & Forget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; }
    #overlay {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.8); color:white; font-family:sans-serif;
      z-index:10;
    }
    #xr-canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="start">Start AR</button>
  </div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';

    // Wait for user tap
    document.getElementById('start').addEventListener('click', async () => {
      const overlay = document.getElementById('overlay');
      overlay.style.display = 'none';

      // 1) Check for WebXR support
      if (!navigator.xr) {
        alert('WebXR not available');
        return;
      }
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        alert('AR not supported on this device/browser');
        return;
      }

      // 2) Load your marker image
      const markerImg = new Image();
      markerImg.src = './marker.png';
      await markerImg.decode();

      // 3) Create Three.js scene
      const canvas = document.getElementById('xr-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      renderer.autoClear = false;
      renderer.xr.enabled = true;
      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();

      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // Create a red box (initially hidden)
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(0.2,0.2,0.2),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );
      box.visible = false;
      scene.add(box);

      // 4) Request an AR session with image-tracking
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['image-tracking', 'local-floor'],
        trackedImages: [{ image: markerImg, widthInMeters: 0.2 }]
      });
      renderer.xr.setSession(session);

      const refSpace = await session.requestReferenceSpace('local-floor');

      // 5) Render loop
      renderer.setAnimationLoop((time, frame) => {
        if (frame) {
          // Get image-tracking results
          const results = frame.getImageTrackingResults();
          for (const result of results) {
            if (result.trackingState === 'tracked') {
              const pose = frame.getPose(result.imageSpace, refSpace);
              if (pose) {
                // Position & orient the box
                box.matrix.fromArray(pose.transform.matrix);
                box.matrix.decompose(box.position, box.quaternion, box.scale);
                box.visible = true;
              }
            }
          }
        }
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
