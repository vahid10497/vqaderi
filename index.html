<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindAR Pin & Forget – Structured</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 1) A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- 2) MindAR core & A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; }
    a-scene     { width:100%; height:100%; }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <!-- your AR camera -->
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker entity + a yellow box that appears only while tracking -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: yellow;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (async () => {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      // 1. Initial Image Tracking
      sceneEl.addEventListener('targetFound', async ({ detail }) => {
        if (pinned || detail.index !== 0) return;
        pinned = true;

        // 2. Anchor Extraction
        //    Read world-space transform of the tracker entity:
        const worldPos  = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        trackerEl.object3D.getWorldPosition(worldPos);
        trackerEl.object3D.getWorldQuaternion(worldQuat);

        // 3. Placement and Fixing
        //    - Turn live box green to signal detection:
        liveBox.setAttribute('material','color: green;');

        //    - Create a fixed red box at the extracted anchor:
        const redBox = document.createElement('a-box');
        redBox.setAttribute('depth',  '0.5');
        redBox.setAttribute('height', '0.5');
        redBox.setAttribute('width',  '0.5');
        redBox.setAttribute('material','color: red;');
        //    - Compute Euler angles from quaternion:
        const euler = new THREE.Euler().setFromQuaternion(worldQuat, 'XYZ');
        //    - Set position & rotation attributes:
        redBox.setAttribute(
          'position',
          `${worldPos.x.toFixed(3)} ${worldPos.y.toFixed(3)} ${worldPos.z.toFixed(3)}`
        );
        redBox.setAttribute(
          'rotation',
          `${THREE.MathUtils.radToDeg(euler.x).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.y).toFixed(1)} ` +
          `${THREE.MathUtils.radToDeg(euler.z).toFixed(1)}`
        );
        //    - Append under the scene root:
        sceneEl.appendChild(redBox);

        // 4. No Continuous Tracking
        //    - Remove the original tracker entity entirely:
        trackerEl.parentNode.removeChild(trackerEl);
        //    - Pause MindAR so it stops clearing or hiding our red box:
        await sceneEl.components['mindar-image'].pause();
      });
    })();
  </script>
</body>
</html>
