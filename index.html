<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Pin & Forget (RAF Delay)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- Tracker + brown live box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: brown;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (function() {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      let pinned = false;

      trackerEl.addEventListener('targetFound', () => {
        if (pinned) return;
        pinned = true;

        // 1) Immediate feedback
        liveBox.setAttribute('material','color: green;');

        // 2) Wait one RAF tick so world matrices are updated
        requestAnimationFrame(() => {
          // 3) Read world-space position/quaternion
          const pos = new THREE.Vector3();
          const quat = new THREE.Quaternion();
          liveBox.object3D.getWorldPosition(pos);
          liveBox.object3D.getWorldQuaternion(quat);
          console.log('🔍 Pinned pos:', pos);

          // 4) Create blue box at exactly that world pos
          const blueBox = document.createElement('a-box');
          blueBox.setAttribute('depth', '0.5');
          blueBox.setAttribute('height','0.5');
          blueBox.setAttribute('width', '0.5');
          blueBox.setAttribute('material','color: blue;');
          blueBox.setAttribute(
            'position',
            `${pos.x.toFixed(3)} ${pos.y.toFixed(3)} ${pos.z.toFixed(3)}`
          );
          sceneEl.appendChild(blueBox);
          console.log('✅ Blue box appended');

          // 5) Cleanup after a short pause
          setTimeout(async () => {
            if (trackerEl.parentNode) trackerEl.parentNode.removeChild(trackerEl);
            await sceneEl.components['mindar-image'].pause();
            console.log('⏹️ Tracker removed & MindAR paused');
          }, 1000);
        });
      });
    })();
  </script>
</body>
</html>
