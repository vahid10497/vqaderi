<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>MindAR Pin &amp; Forget (Forward Offset)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR.js core + A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100 }
    a-scene     { width:100%; height:100 }
  </style>
</head>
<body>
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    debugUIEnabled="true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <!-- 1) Camera + on-screen debug text -->
    <a-camera look-controls="enabled: false">
      <a-text
        id="pinText"
        value="🔍 Waiting for image…"
        position="0 -0.5 -1"
        align="center"
        color="white"
        width="2"
      ></a-text>
    </a-camera>

    <!-- 2) Tracker + initial brown box -->
    <a-entity id="tracker" mindar-image-target="targetIndex: 0">
      <a-box
        id="liveBox"
        position="0 0.5 0"
        depth="0.5" height="0.5" width="0.5"
        material="color: brown;"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    (function() {
      const sceneEl   = document.getElementById('scene');
      const trackerEl = document.getElementById('tracker');
      const liveBox   = document.getElementById('liveBox');
      const pinText   = document.getElementById('pinText');
      let pinned = false;

      trackerEl.addEventListener('targetFound', () => {
        if (pinned) return;
        pinned = true;

        // 1) Immediate feedback: brown → green
        liveBox.setAttribute('material','color: green;');

        // 2) Compute scene-local pin position
        const trackerPos = trackerEl.object3D.position.clone();
        const liveOffset = liveBox.object3D.position.clone();
        const pinPos = trackerPos.add(liveOffset);
        console.log('📐 Pin position (scene-local):', pinPos);

        // Update on-screen text
        pinText.setAttribute('value',
          `📐 Pin @ x=${pinPos.x.toFixed(3)} ` +
          `y=${pinPos.y.toFixed(3)} ` +
          `z=${pinPos.z.toFixed(3)}`
        );

        // 3) Spawn blue box 1 m in front along −Z (camera forward)
        const blueBox = document.createElement('a-box');
        blueBox.setAttribute('depth','0.5');
        blueBox.setAttribute('height','0.5');
        blueBox.setAttribute('width','0.5');
        blueBox.setAttribute('material','color: blue;');
        // position = pinPos + (0,0,−1)
        blueBox.setAttribute(
          'position',
          `${pinPos.x.toFixed(3)} ${pinPos.y.toFixed(3)} ${(pinPos.z - 1).toFixed(3)}`
        );
        sceneEl.appendChild(blueBox);
        console.log('✅ Blue box appended at offset');

        // 4) After 3s, clean up tracker & pause
        setTimeout(async () => {
          if (trackerEl.parentNode) trackerEl.parentNode.removeChild(trackerEl);
          await sceneEl.components['mindar-image'].pause();
          pinText.setAttribute('value','⏹️ Tracker removed, AR paused');
          console.log('⏹️ Tracker removed & MindAR paused');
        }, 3000);
      });
    })();
  </script>
</body>
</html>
