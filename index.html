<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>WebXR Image-Tracking & Fallback</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { margin:0; overflow:hidden; }
    #status {
      position:absolute; top:0; left:0; right:0;
      background:rgba(0,0,0,0.7); color:#fff;
      font-family:sans-serif; text-align:center;
      padding:0.5em; z-index:1;
    }
    canvas { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <div id="status">⏳ Checking WebXR...</div>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/webxr/ARButton.js';

    const status = txt => document.getElementById('status').textContent = txt;
    let renderer, scene, camera;

    (async function init() {
      if (!navigator.xr) return status('❌ WebXR not available');
      status('✅ WebXR available');

      const arOK = await navigator.xr.isSessionSupported('immersive-ar');
      if (!arOK) return status('❌ AR not supported on this device');
      status('✅ AR supported');

      // Check Image Tracking support
      let imgOK = false;
      try {
        imgOK = await navigator.xr.isSessionSupported('immersive-ar', {
          requiredFeatures: ['image-tracking']
        });
      } catch {}
      status(`Image Tracking supported: ${imgOK ? '✅ yes' : '❌ no'}`);

      // If we plan to use it, load the marker
      let trackedImages = null;
      if (imgOK) {
        status('📥 Loading marker.png…');
        try {
          const img = new Image();
          img.src = './marker.png';
          await img.decode();
          const bitmap = await createImageBitmap(img);
          trackedImages = [{ image: bitmap, widthInMeters: 0.2 }];
          status('✅ marker.png loaded');
        } catch (e) {
          console.error(e);
          imgOK = false;
          status('❌ Failed to load marker.png');
        }
      }

      // Three.js + AR setup
      scene    = new THREE.Scene();
      camera   = new THREE.PerspectiveCamera();
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('xr-canvas'),
        alpha: true
      });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // Fallback sphere (auto-place)
      const fallbackSphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 32, 16),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      fallbackSphere.visible = false;
      scene.add(fallbackSphere);

      // Build ARButton options
      const features = ['local-floor'];
      const opts = { requiredFeatures: features };
      if (imgOK) {
        features.push('image-tracking');
        opts.trackedImages = trackedImages;
      }

      // Always append a button so camera can open
      document.body.appendChild( ARButton.createButton(renderer, opts) );

      renderer.xr.addEventListener('sessionstart', async () => {
        if (imgOK) {
          status('▶️ Point at your marker to anchor');
          startImageTracking();
        } else {
          status('🔸 Auto-placing sphere 2 m ahead');
          // Auto-place immediately
          const cam = renderer.xr.getCamera(camera);
          const dir = new THREE.Vector3(0,0,-1)
              .applyQuaternion(cam.quaternion);
          const pos = cam.position.clone().add(dir.multiplyScalar(2));
          fallbackSphere.position.copy(pos);
          fallbackSphere.quaternion.copy(cam.quaternion);
          fallbackSphere.visible = true;
          status('✅ Fallback sphere placed');
        }
      });

      // Render loop
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    })();

    // Image-tracking + anchor flow
    async function startImageTracking() {
      const session  = renderer.xr.getSession();
      const refSpace = await session.requestReferenceSpace('local-floor');

      let anchor = null;
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 32, 16),
        new THREE.MeshStandardMaterial({ color: 0x00ff00 })
      );
      sphere.visible = false;
      scene.add(sphere);

      renderer.setAnimationLoop(async (time, frame) => {
        // 1) Look for the first tracked result
        if (!anchor) {
          const results = frame.getImageTrackingResults();
          for (const result of results) {
            if (result.trackingState === 'tracked') {
              const pose = frame.getPose(result.imageSpace, refSpace);
              if (pose) {
                anchor = await frame.createAnchor(pose.transform, refSpace);
                sphere.visible = true;
                status('📌 Image detected — anchor created');
              }
              break;
            }
          }
        }

        // 2) If we have an anchor, update the sphere from it
        if (anchor) {
          const anchorPose = frame.getPose(anchor.anchorSpace, refSpace);
          if (anchorPose) {
            sphere.matrix.fromArray(anchorPose.transform.matrix);
            sphere.matrix.decompose(
              sphere.position,
              sphere.quaternion,
              sphere.scale
            );
            sphere.matrixAutoUpdate = false;
          }
        }

        renderer.render(scene, camera);
      });
    }
  </script>
</body>
</html>
